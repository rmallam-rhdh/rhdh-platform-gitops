# One listener + one Certificate + one passthrough Route per hostname on a shared gateway (lab-only).
# Needs the Service Mesh 3 (Istio ambient) and cert-manager operators. See charts/gateway-cert-lab/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-cert-lab
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: gateway-cert-lab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/gateway-cert-lab
    helm:
      valueFiles:
        - values.yaml
        - values-deploy.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: gwcert-ingress
  syncPolicy:
    automated:
      prune: true        # removing a host from the catalogue removes its listener, Certificate and Route
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: Gateway
      jqPathExpressions:
        - .status
    - group: cert-manager.io
      kind: Certificate
      jqPathExpressions:
        - .status
