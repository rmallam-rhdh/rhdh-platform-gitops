# Red Hat Developer Hub (`developer-hub-tls` in `rhdh-cnpg-tls-test`) connecting to
# `backstage-psql-rw` over strict TLS (`rejectUnauthorized: true`) using ONLY the
# public CA bundle (`enterprise-ca-chain`) via `NODE_EXTRA_CA_CERTS`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub-cnpg-tls
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: developer-hub-cnpg-tls
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/developer-hub
    helm:
      valueFiles:
        - values.yaml
        - values-cnpg-tls-lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-cnpg-tls-test
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: rhdh.redhat.com
      kind: Backstage
      jqPathExpressions:
        - .status
