# Dedicated RHDH instance for Kerberos proxy testing (namespace rhdh-kerberos).
# Requires: kerberos-lab Application Ready + Secret rhdh-kerberos-secrets.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-hub-kerberos
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: developer-hub-kerberos
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/developer-hub
    helm:
      valueFiles:
        - values.yaml
        - values-kerberos-lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-kerberos
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: rhdh.redhat.com
      kind: Backstage
      jqPathExpressions:
        - .status
