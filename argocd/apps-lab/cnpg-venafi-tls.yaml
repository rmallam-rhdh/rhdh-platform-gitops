# CloudNativePG Cluster (`backstage-psql` in `rhdh-cnpg-tls-test`) using leaf-only
# cert-manager Certificates (`cnpg-server-tls`, `cnpg-replication-tls`) and public
# CA bundle (`enterprise-ca-chain`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-venafi-tls
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: cnpg-venafi-tls
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/cnpg
    helm:
      valueFiles:
        - values.yaml
        - values-venafi-tls-lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-cnpg-tls-test
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .status
