# Non-Prod and Prod Argo CD Applications labeled `app: plugin-kitchen-sink` so RHDH's
# unified Command Centre Argo CD card (`argocd/app-selector: app=plugin-kitchen-sink`)
# displays both environments side-by-side and reconciles Day-2 promotion PRs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-kitchen-sink-nonprod
  namespace: openshift-gitops
  labels:
    app: plugin-kitchen-sink
    environment: nonprod
    app.kubernetes.io/part-of: idp-platform
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/demo-release
    helm:
      valueFiles:
        - values.yaml
        - ../../environments/nonprod/plugin-kitchen-sink/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-kitchen-sink-prod
  namespace: openshift-gitops
  labels:
    app: plugin-kitchen-sink
    environment: prod
    app.kubernetes.io/part-of: idp-platform
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/demo-release
    helm:
      valueFiles:
        - values.yaml
        - ../../environments/prod/plugin-kitchen-sink/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
