# Simulated 2-tier Enterprise Venafi PKI (Root + Intermediate CA in cert-manager)
# plus RBAC-scoped Job exporting ONLY public `ca.crt` into `rhdh-cnpg-tls-test`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: venafi-pki-lab
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: venafi-pki-lab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/venafi-pki-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
