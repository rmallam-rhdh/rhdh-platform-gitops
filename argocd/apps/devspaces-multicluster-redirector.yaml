# Multicluster redirector (RH Quarkus image + OAuth Proxy).
# Edit charts/devspaces-multicluster-redirector/values-deploy.yaml for group → URL map.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devspaces-multicluster-redirector
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: multicluster-redirector
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/devspaces-multicluster-redirector
    helm:
      valueFiles:
        - values.yaml
        - values-deploy.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: devspaces-redirector
  # Argo CD renders Helm templates offline (lookup returns {}), so ignore
  # data.session_secret on the generated Secret to keep cookies stable across syncs.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: devspaces-multicluster-redirector-session-secret
      namespace: devspaces-redirector
      jsonPointers:
        - /data/session_secret
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
