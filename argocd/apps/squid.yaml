# Authenticated forward proxy. Hub uses it when httpProxy.enabled is true.
# Secret squid-htpasswd must exist (secrets.mode=external). Do not put the
# password in git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: squid
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: squid
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam/rhdh-platform-gitops
    targetRevision: main
    path: charts/squid
  destination:
    server: https://kubernetes.default.svc
    namespace: squid
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
