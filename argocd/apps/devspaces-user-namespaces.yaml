# Reconciles per-user Dev Spaces namespaces (${user}-devspaces-${random}),
# ResourceQuotas, LimitRanges, RoleBindings, and initial DevWorkspaces
# committed by the RHDH Golden Path template.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devspaces-user-namespaces
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: devspaces-tenants
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: tenants/devspaces-namespaces
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-devspaces
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: workspace.devfile.io
      kind: DevWorkspace
      jsonPointers:
        - /spec/started
        - /spec/contributions
        - /status
        - /metadata/labels
        - /metadata/annotations
        - /metadata/finalizers
    - group: workspace.devfile.io
      kind: DevWorkspaceTemplate
      jsonPointers:
        - /metadata/ownerReferences
        - /metadata/annotations
