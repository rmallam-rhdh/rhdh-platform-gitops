# Second CloudNativePG Cluster in rhdh-dr. The Hub keeps using rhdh/rhdh-pg.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-dr
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: cnpg-dr
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
    path: charts/cnpg
    helm:
      valueFiles:
        - values-dr.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-dr
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jqPathExpressions:
        - .status
