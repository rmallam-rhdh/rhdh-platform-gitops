apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: '2'
    argocd.argoproj.io/tracking-id: developer-hub:rhdh.redhat.com/Backstage:rhdh/developer-hub
  labels:
    app.kubernetes.io/component: developer-hub
    app.kubernetes.io/instance: developer-hub
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: developer-hub
    app.kubernetes.io/part-of: acme-platform
    helm.sh/chart: developer-hub-0.1.0
  name: developer-hub
  namespace: rhdh
spec:
  application:
    appConfig:
      configMaps:
      - name: app-config-rhdh
      - name: app-config-rhdh-branding
      mountPath: "/opt/app-root/src"
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    extraEnvs:
      envs:
      - name: NODE_TLS_REJECT_UNAUTHORIZED
        value: '0'
      - name: NODE_OPTIONS
        value: "--no-node-snapshot --use-env-proxy"
      secrets:
      - name: rhdh-secrets
    extraFiles:
      configMaps:
      - name: rbac-policies
      mountPath: "/opt/app-root/src"
    route:
      enabled: true
  database:
    enableLocalDb: false
  deployment:
    patch:
      spec:
        replicas: 2
        template:
          metadata:
            labels:
              app.kubernetes.io/name: backstage
              backstage.io/kubernetes-id: developer-hub
          spec:
            automountServiceAccountToken: true
            containers:
            - env:
              - name: POSTGRES_HOST
                valueFrom:
                  secretKeyRef:
                    key: host
                    name: rhdh-pg-app
              - name: POSTGRES_PORT
                valueFrom:
                  secretKeyRef:
                    key: port
                    name: rhdh-pg-app
              - name: POSTGRES_USER
                valueFrom:
                  secretKeyRef:
                    key: username
                    name: rhdh-pg-app
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: rhdh-pg-app
              - name: POSTGRES_DB
                valueFrom:
                  secretKeyRef:
                    key: dbname
                    name: rhdh-pg-app
              name: backstage-backend
              volumeMounts:
              - mountPath: "/opt/app-root/src/catalog-demo"
                name: demo-catalog
                readOnly: true
              - mountPath: "/opt/app-root/src/golden-path"
                name: golden-path
                readOnly: true
            serviceAccountName: default
            volumes:
            - ephemeral:
                volumeClaimTemplate:
                  spec:
                    accessModes:
                    - ReadWriteOnce
                    resources:
                      requests:
                        storage: 8Gi
              name: dynamic-plugins-root
            - configMap:
                name: rhdh-demo-catalog
              name: demo-catalog
            - configMap:
                name: rhdh-golden-path
              name: golden-path
  monitoring:
    enabled: false
status:
  conditions:
  - lastTransitionTime: '2026-11-05T00:07:11Z'
    message: ''
    reason: Deployed
    status: 'True'
    type: Deployed
