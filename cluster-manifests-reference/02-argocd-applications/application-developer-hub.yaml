apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/hydrate: normal
    argocd.argoproj.io/sync-wave: '3'
    argocd.argoproj.io/tracking-id: idp-platform:argoproj.io/Application:openshift-gitops/developer-hub
  labels:
    app.kubernetes.io/component: developer-hub
    app.kubernetes.io/part-of: idp-platform
  name: developer-hub
  namespace: openshift-gitops
spec:
  destination:
    namespace: rhdh
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: rhdh.redhat.com
    jqPathExpressions:
    - ".status"
    kind: Backstage
  project: default
  source:
    helm:
      valueFiles:
      - values.yaml
      - values-demo.yaml
      - values-deploy.yaml
    path: charts/developer-hub
    repoURL: https://github.com/rmallam-rhdh/rhdh-platform-gitops
    targetRevision: main
  syncPolicy:
    automated:
      enabled: false
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - SkipDryRunOnMissingResource=true
