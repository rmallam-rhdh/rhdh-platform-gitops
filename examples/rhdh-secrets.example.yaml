# Copy to a local file (not this repo), fill values, apply:
#   oc -n rhdh apply -f rhdh-secrets.yaml
# If you do that, set secrets.mode: external in values-deploy.yaml
# so Helm does not own the Secret.
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
type: Opaque
stringData:
  BACKEND_SECRET: change-me
  CLUSTER_BASE_DOMAIN: apps.example.com
  # Add AZURE_*, GITHUB_TOKEN, LDAP_BIND_PASSWORD, plugin tokens as needed.
