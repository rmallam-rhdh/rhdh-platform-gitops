# Copy locally, fill values, apply. Do not commit the filled file.
#   oc -n rhdh apply -f rhdh-secrets.yaml
# Keep secrets.mode: external in values-deploy.yaml so Helm does not own this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-secrets
  namespace: rhdh
type: Opaque
stringData:
  BACKEND_SECRET: change-me
  AUTH_SESSION_SECRET: change-me
  CLUSTER_BASE_DOMAIN: apps.example.com
  AZURE_CLIENT_ID: change-me
  AZURE_CLIENT_SECRET: change-me
  AZURE_TENANT_ID: change-me
  GITHUB_TOKEN: change-me
  GITHUB_OAUTH_CLIENT_ID: change-me
  GITHUB_OAUTH_CLIENT_SECRET: change-me
  LDAP_BIND_PASSWORD: change-me
  JENKINS_USERNAME: admin
  JENKINS_API_TOKEN: change-me
  JENKINS_BASIC_AUTH_B64: change-me
  JENKINS_BASE_URL: http://jenkins.jenkins.svc
  SONARQUBE_API_KEY: change-me
  SONARQUBE_BASE_URL: http://sonarqube.sonarqube.svc:9000
  VAULT_TOKEN: change-me
  VAULT_ADDR: http://vault.vault.svc:8200
  ARGOCD_TOKEN: change-me
  ARGOCD_URL: https://openshift-gitops-server-openshift-gitops.apps.example.com
  JIRA_BASE_URL: https://example.atlassian.net
  JIRA_TOKEN: "Basic change-me"
  DYNATRACE_URL: https://example.apps.dynatrace.com
  DYNATRACE_ACCESS_TOKEN: change-me
  DYNATRACE_CLIENT_ID: change-me
  DYNATRACE_CLIENT_SECRET: change-me
  DYNATRACE_ACCOUNT_URN: change-me
  KIALI_URL: https://kiali.istio-system.svc:20001
  SERVICENOW_BASE_URL: https://example.service-now.com
  SERVICENOW_USERNAME: change-me
  SERVICENOW_PASSWORD: change-me
  # Hub egress via Squid. Percent-encode @ : / in the password.
  # .service-now.com is on NO_PROXY until the Squid path to that host is proven.
  HTTP_PROXY: http://rhdh:change-me@squid.squid.svc:3128
  HTTPS_PROXY: http://rhdh:change-me@squid.squid.svc:3128
  NO_PROXY: localhost,127.0.0.1,172.30.0.1,kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local,.svc,.svc.cluster.local,.cluster.local,rhdh-pg-rw,rhdh-pg-rw.rhdh.svc,jenkins.jenkins.svc,sonarqube.sonarqube.svc,vault.vault.svc,saas-stubs.saas-stubs.svc,openldap.ldap.svc,.service-now.com
  ARTIFACTORY_TOKEN: change-me
  ARTIFACTORY_BASE_URL: http://saas-stubs.saas-stubs.svc:8080
  APIC_CLIENT_ID: change-me
  APIC_SECRET: change-me
  APIC_API_KEY: change-me
  APIC_BASE_URL: http://saas-stubs.saas-stubs.svc:8080
  BITBUCKET_USERNAME: change-me
  BITBUCKET_APP_PASSWORD: change-me
  SNYK_TOKEN: change-me
  SNYK_ORG_SLUG: stub-org
