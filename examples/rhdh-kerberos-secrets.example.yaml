# Lab Secret for the dedicated Kerberos-test Hub (namespace rhdh-kerberos).
# Apply before syncing argocd/apps/developer-hub-kerberos.yaml:
#   oc apply -f examples/rhdh-kerberos-secrets.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-kerberos-secrets
  namespace: rhdh-kerberos
type: Opaque
stringData:
  BACKEND_SECRET: lab-kerberos-backend-secret-change-me
  # No userinfo — Hub sidecar (kerberos-bridge) does Negotiate to corporate-proxy.
  HTTP_PROXY: http://127.0.0.1:3128
  HTTPS_PROXY: http://127.0.0.1:3128
  # Keep registry/OCI plugin pulls and in-cluster traffic off the Negotiate path.
  # Leave Atlassian / GitHub API off NO_PROXY so Jira + publish:github exercise Negotiate.
  NO_PROXY: localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local,kubernetes.default,kubernetes.default.svc,kubernetes.default.svc.cluster.local,172.30.0.1,registry.redhat.io,registry.access.redhat.com,ghcr.io,quay.io
  # Copy real values from the main Hub secret (rhdh/rhdh-secrets) for lab use:
  #   JIRA_BASE_URL, JIRA_TOKEN, GITHUB_TOKEN, SERVICENOW_*
  JIRA_BASE_URL: https://YOUR.atlassian.net
  JIRA_TOKEN: "Basic REPLACE_ME"
  GITHUB_TOKEN: REPLACE_ME
  SERVICENOW_BASE_URL: https://YOUR.service-now.com
  SERVICENOW_USERNAME: REPLACE_ME
  SERVICENOW_PASSWORD: REPLACE_ME
