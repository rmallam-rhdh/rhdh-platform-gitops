# Standalone RHDH 1.10 Branding & Theme ConfigMap — Crimson & Deep Plum Enterprise Palette
# Includes custom Light + Dark `fullLogo` SVGs, `iconLogo`, and full Light/Dark theme tokens.
#
# Apply directly (`oc apply -f`) or include in Argo CD / Kustomize, then list
# `app-config-rhdh-branding` under `spec.application.appConfig.configMaps` on your Backstage CR.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh-branding
  namespace: rhdh
  labels:
    app.kubernetes.io/part-of: developer-hub
    app.kubernetes.io/component: branding
data:
  app-config-branding.yaml: |
    app:
      title: "Acme Developer Hub"
      baseUrl: "https://backstage-developer-hub-rhdh.apps.example.com"
      branding:
        # ── Custom Sidebar Logos (Base64 Data URIs — SVG or PNG) ──────────────
        # Generate your own from SVG/PNG files:
        #   echo "data:image/svg+xml;base64,$(base64 -i logo-light.svg | tr -d '\n')"
        #   echo "data:image/png;base64,$(base64 -i logo-icon.png | tr -d '\n')"
        fullLogoWidth: "172px"
        fullLogo:
          # Dark-text wordmark for the light sidebar (#F9F8FC)
          light: "data:image/svg+xml;base64,"
          # White-text wordmark for the dark sidebar (#121026)
          dark: "data:image/svg+xml;base64,"
        # Compact square mark shown when the left sidebar is collapsed
        iconLogo: "data:image/svg+xml;base64,"

        theme:
          # ── Light Mode (Crimson #DA1710 + Deep Plum/Indigo #1F1C4F -> #621A4B) ─
          light:
            defaultPageTheme: default
            options:
              # Fixes RHDH 1.10 header tab contrast (`color: unset` inheritance bug)
              tabs: mui
            pageTheme:
              default:
                backgroundColor:
                  - "#1F1C4F"
                  - "#621A4B"
                fontColor: "#FFFFFF"
            palette:
              primary:
                main: "#DA1710"
              secondary:
                main: "#621A4B"
              text:
                primary: "#181636"
                secondary: "#524F6E"
              textSubtle: "#524F6E"
              tabbar:
                indicator: "#DA1710"
              background:
                default: "#F3F2F7"
                paper: "#FFFFFF"
              navigation:
                background: "#F9F8FC"
                indicator: "#DA1710"
                color: "#2D2A4A"
                selectedColor: "#DA1710"
                navItem:
                  hoverBackground: "#F1ECF6"
                submenu:
                  background: "#FFFFFF"
              rhdh:
                general:
                  pageInset: "1rem"
                  pageInsetBackgroundColor: "#F9F8FC"
                  mainSectionBackgroundColor: "#F3F2F7"
                  cardBackgroundColor: "#FFFFFF"
                  cardBorderColor: "#D8D5E2"
                  paperBorderColor: "#D8D5E2"
                  formControlBackgroundColor: "#FFFFFF"
                  sidebarBackgroundColor: "#F9F8FC"
                  sidebarDividerColor: "#E5E2EE"
                  sidebarItemSelectedBackgroundColor: "#F1ECF6"
                  tableBackgroundColor: "#FFFFFF"
                  tableBorderColor: "#E5E2EE"
                  tableRowHover: "#F9F8FC"
                  tableTitleColor: "#181636"
                  tableSubtitleColor: "#524F6E"
                  tableColumnTitleColor: "#2D2A4A"
                  tabsLinkHoverBackgroundColor: "rgba(218, 23, 16, 0.08)"
                  appBarBackgroundScheme: light
                  appBarBackgroundColor: "#FFFFFF"
                  appBarForegroundColor: "#181636"
                primary:
                  main: "#DA1710"
                  focusVisibleBorder: "#DA1710"
                secondary:
                  main: "#621A4B"
                  focusVisibleBorder: "#621A4B"
                cards:
                  headerTextColor: "#181636"
                  headerBackgroundColor: "#FAF9FC"
                  headerBackgroundImage: none

          # ── Dark Mode (Deep Charcoal-Plum #121026 + Coral-Crimson #FF5A52) ───
          dark:
            defaultPageTheme: default
            options:
              tabs: mui
            pageTheme:
              default:
                backgroundColor:
                  - "#121026"
                  - "#4A153B"
                fontColor: "#FFFFFF"
            palette:
              primary:
                main: "#FF5A52"
              secondary:
                main: "#E879F9"
              text:
                primary: "#F8F7FC"
                secondary: "#C8C5DF"
              textSubtle: "#C8C5DF"
              tabbar:
                indicator: "#FF5A52"
              background:
                default: "#17152B"
                paper: "#201D3A"
              navigation:
                background: "#121026"
                indicator: "#FF5A52"
                color: "#C8C5DF"
                selectedColor: "#FFFFFF"
                navItem:
                  hoverBackground: "#1E1B36"
                submenu:
                  background: "#121026"
              rhdh:
                general:
                  pageInset: "1rem"
                  pageInsetBackgroundColor: "#121026"
                  mainSectionBackgroundColor: "#17152B"
                  cardBackgroundColor: "#201D3A"
                  cardBorderColor: "#36315E"
                  paperBorderColor: "#36315E"
                  formControlBackgroundColor: "#2A2648"
                  sidebarBackgroundColor: "#121026"
                  sidebarDividerColor: "#2A2648"
                  sidebarItemSelectedBackgroundColor: "#1E1B36"
                  tableBackgroundColor: "#201D3A"
                  tableBorderColor: "#36315E"
                  tableRowHover: "#272347"
                  tableTitleColor: "#F8F7FC"
                  tableSubtitleColor: "#C8C5DF"
                  tableColumnTitleColor: "#C8C5DF"
                  tabsLinkHoverBackgroundColor: "rgba(255, 90, 82, 0.16)"
                  appBarBackgroundScheme: dark
                  appBarBackgroundColor: "#121026"
                  appBarForegroundColor: "#F8F7FC"
                primary:
                  main: "#FF5A52"
                  focusVisibleBorder: "#FF5A52"
                secondary:
                  main: "#E879F9"
                  focusVisibleBorder: "#E879F9"
                cards:
                  headerTextColor: "#F8F7FC"
                  headerBackgroundColor: "#272347"
                  headerBackgroundImage: none
