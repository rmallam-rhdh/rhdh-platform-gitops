# Copy locally, fill, apply. Do not commit the filled file.
#   openssl passwd -apr1
#   # then: rhdh:<hash> as the passwd value
#   oc -n squid apply -f squid-htpasswd.yaml
# Keep charts/squid secrets.mode: external so Helm does not own this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: squid-htpasswd
  namespace: squid
type: Opaque
stringData:
  passwd: "rhdh:placeholder"
