# Example placeholder Secret for `developer-hub-cnpg-tls` (NEVER commit real secrets).
# Generate at deploy time via:
#   oc create secret generic rhdh-cnpg-tls-secrets -n rhdh-cnpg-tls-test \
#     --from-literal=BACKEND_SECRET="$(openssl rand -base64 32)"
apiVersion: v1
kind: Secret
metadata:
  name: rhdh-cnpg-tls-secrets
  namespace: rhdh-cnpg-tls-test
type: Opaque
stringData:
  BACKEND_SECRET: REPLACE_WITH_RANDOM_32_BYTE_BASE64
