apiVersion: v1
kind: ResourceQuota
metadata:
  name: devspaces-tenant-quota
  namespace: ${{ values.workspaceNamespace }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "4"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: devspaces-container-limits
  namespace: ${{ values.workspaceNamespace }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 2Gi
      defaultRequest:
        cpu: 250m
        memory: 512Mi
