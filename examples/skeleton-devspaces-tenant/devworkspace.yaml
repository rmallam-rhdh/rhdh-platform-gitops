apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: ${{ values.appName }}
  namespace: ${{ values.workspaceNamespace }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
    rhdh.redhat.com/app: ${{ values.appName }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    che.eclipse.org/che-editor: che-incubator/che-code/latest
spec:
  started: false
  routingClass: che
  template:
    attributes:
      controller.devfile.io/devworkspace-config:
        name: devworkspace-config
        namespace: openshift-devspaces
      controller.devfile.io/storage-type: per-user
    projects:
      - name: ${{ values.appName }}
        git:
          remotes:
            origin: ${{ values.appRepoUrl }}
    components:
      - name: udi-tools
        container:
          image: registry.redhat.io/devspaces/udi-rhel9:3.30
          memoryLimit: 3Gi
          memoryRequest: 512Mi
          cpuLimit: 2000m
          cpuRequest: 250m
          mountSources: true
          sourceMapping: /projects
          env:
            - name: PORT
              value: "${{ values.port }}"
          endpoints:
            - name: http-app
              targetPort: ${{ values.port }}
              exposure: public
              protocol: https
    commands:
      - id: run-app
        exec:
          component: udi-tools
          commandLine: node server.js
          workingDir: ${PROJECT_SOURCE}
