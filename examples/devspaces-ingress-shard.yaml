# Not applied by the Dev Spaces Helm chart.
# The Ingress Controller operator must already be installed.
# Apply only when Dev Spaces should leave the default router:
#
#   oc apply -f examples/devspaces-ingress-shard.yaml
#
# spec.domain and spec.routeSelector.matchLabels must match
# charts/devspaces values networking.domain and networking.labels.
# Also set networking.domain in that values file to this same domain,
# or the Route hostname will not match this router's certificate.
apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: devspaces
  namespace: openshift-ingress-operator
spec:
  domain: devspaces.apps.example.com
  replicas: 2
  endpointPublishingStrategy:
    type: LoadBalancerService
  routeSelector:
    matchLabels:
      ingress.openshift.io/shard: devspaces
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: openshift-devspaces
