# ==============================================================================
# Thin Application Values (Consumes IDP Platform Base Chart: idp-service-chart)
# All Kubernetes, OpenShift Route, and Ambient Service Mesh templates live in
# the IDP-managed `idp-service-chart` dependency — zero template duplication!
# ==============================================================================
idp-service-chart:
  name: ${{ values.appName }}
  appId: ${{ values.appId | default("APP-1042") | dump }}
  ownerGroup: ${{ values.groupName | default("group:default/developers") | dump }}
  namespace: ${{ values.targetNamespace }}

  replicaCount: 1

  image:
    repository: registry.access.redhat.com/ubi9/openjdk-21-runtime
    tag: latest
    pullPolicy: IfNotPresent

  # Immediate executable bootstrap HTTP server for /health and /api so the
  # deployment is Ready in demo-dev immediately after Golden Path creation,
  # before a custom app image is built and pushed from Containerfile.
  command:
    - /bin/bash
    - -c
    - |
      mkdir -p /tmp/web/api
      printf '{"status":"ok","app":"${{ values.appName }}","appId":"${{ values.appId | default("APP-1042") }}"}\n' > /tmp/web/health
      printf '{"service":"${{ values.appName }}","system":"${{ values.systemName }}","appId":"${{ values.appId | default("APP-1042") }}","message":"ok"}\n' > /tmp/web/api/index.html
      printf '<!doctype html><html><body style="font-family:sans-serif;margin:2rem"><h1>${{ values.appName }} (${{ values.appId | default("APP-1042") }})</h1><p>${{ values.appDescription }}</p><p>Deployed via IDP Shared Base Chart (idp-service-chart:1.0.0) + Argo CD</p></body></html>\n' > /tmp/web/index.html
      exec java -m jdk.httpserver -b 0.0.0.0 -p ${{ values.port }} -d /tmp/web

  service:
    port: ${{ values.port }}
    healthCheckPath: /health

  clusterBaseDomain: ${{ values.clusterBaseDomain }}

  mesh:
    enabled: true
    dataplane: ambient
    denyAll: true
    waypoint:
      enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
