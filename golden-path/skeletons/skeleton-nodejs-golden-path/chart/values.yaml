# ==============================================================================
# Thin Application Values (Consumes IDP Platform Base Chart: idp-service-chart)
# All Kubernetes, OpenShift Route, and Ambient Service Mesh templates live in
# the IDP-managed `idp-service-chart` dependency — zero template duplication!
# ==============================================================================
idp-service-chart:
  name: ${{ values.appName }}
  appId: ${{ values.appId | default("APP-2048") | dump }}
  ownerGroup: ${{ values.groupName | default("group:default/developers") | dump }}
  namespace: ${{ values.targetNamespace }}

  replicaCount: 1

  image:
    repository: registry.access.redhat.com/ubi9/nodejs-20-minimal
    tag: latest
    pullPolicy: IfNotPresent

  # Immediate executable bootstrap Node.js HTTP server for /health and / so the
  # deployment is Ready in demo-dev immediately after Golden Path creation,
  # before a custom app image is built and pushed from Containerfile.
  command:
    - node
    - -e
    - |
      const http = require('http');
      const port = Number(process.env.PORT || ${{ values.port }});
      http.createServer((req, res) => {
        if (req.url === '/health' || req.url === '/healthz') {
          res.writeHead(200, {'Content-Type': 'application/json'});
          return res.end(JSON.stringify({status: 'ok', app: '${{ values.appName }}', appId: '${{ values.appId | default("APP-2048") }}'}));
        }
        res.writeHead(200, {'Content-Type': 'text/html; charset=utf-8'});
        res.end('<!doctype html><html><body style="font-family:sans-serif;margin:2rem"><h1>${{ values.appName }} (${{ values.appId | default("APP-2048") }})</h1><p>${{ values.appDescription }}</p><p>Deployed via IDP Shared Base Chart (idp-service-chart:1.0.0) + Argo CD</p></body></html>');
      }).listen(port, '0.0.0.0', () => console.log('${{ values.appName }} listening on ' + port));

  service:
    port: ${{ values.port }}
    healthCheckPath: /health

  clusterBaseDomain: ${{ values.clusterBaseDomain }}

  mesh:
    enabled: true
    dataplane: ambient
    denyAll: true
    waypoint:
      enabled: true

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
