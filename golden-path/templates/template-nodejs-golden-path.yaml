apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: acme-nodejs-golden-path
  title: Node.js 20 Enterprise Golden Path (Command Centre + Dev Spaces GitOps)
  description: >
    End-to-end Node.js 20 Golden Path. Takes APPID and Owning Group, scaffolds
    the Git repository (Node.js REST + OpenAPI 3.0, unit tests, Jenkinsfile,
    SonarQube gate, Ambient Service Mesh Helm chart, TechDocs), wires all 9
    Command Centre tabs (Multi-Cluster Kubernetes, Kiali, Multi-Argo CD, Jenkins,
    SonarQube, Snyk, Vault Enterprise, Dynatrace, PagerDuty, Jira, ServiceNow),
    and checks charts/devspaces-user-namespaces/values.yaml — reusing the user's
    existing Dev Spaces namespace if present, or updating values.yaml in Git so
    Argo CD provisions their namespace and DevWorkspace via Helm.
  tags:
    - nodejs
    - nodejs-20
    - golden-path
    - command-centre
    - devspaces
    - gitops
    - service-mesh
    - sonarqube
    - jenkins
    - recommended
spec:
  owner: group:platform-team
  type: service
  parameters:
    - title: 1. Application Identity & Squad Ownership (APPID & Group)
      required:
        - appId
        - groupName
        - appName
        - githubOwner
        - systemName
      properties:
        appId:
          title: Application ID (APPID)
          description: Enterprise CMDB / Portfolio Application Identifier (stamped on Catalog, ServiceNow, Kubernetes labels, and Dev Spaces).
          type: string
          default: APP-2048
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{1,31}$'
          ui:autofocus: true
        groupName:
          title: Owning Squad / Support Group (groupName)
          description: Select the owning team from the RHDH Catalog (sets Entity Owner, ServiceNow Support Group, and Vault Namespace RBAC).
          type: string
          default: group:default/developers
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              - kind: Group
        appName:
          title: Service & GitHub Repository Name
          description: New public GitHub repository and microservice name (lowercase letters, numbers, hyphens).
          type: string
          pattern: '^[a-z][a-z0-9-]{2,28}[a-z0-9]$'
        appDescription:
          title: Service Description
          type: string
          default: Enterprise Node.js 20 microservice with Ambient Mesh, OpenAPI, and Command Centre telemetry
        systemName:
          title: Catalog System
          description: System this microservice belongs to in the RHDH architecture graph.
          type: string
          default: plugin-kitchen-sink
          pattern: '^[a-z][a-z0-9-]{1,40}$'
        systemDescription:
          title: System Description
          type: string
          default: Enterprise Golden Path Platform System
        githubOwner:
          title: GitHub Organization / Owner
          type: string
          default: rmallam-rhdh
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
        gitopsRepoName:
          title: Platform GitOps Repository
          description: Self-contained GitOps repository hosting Golden Path skeletons and the devspaces-user-namespaces Helm chart.
          type: string
          default: rhdh-platform-gitops

    - title: 2. OpenShift Dev Spaces Workspace & GitOps Namespace Check
      required:
        - openShiftUser
        - userSlug
        - namespaceSuffix
      properties:
        provisionDevSpaces:
          title: Check & Provision Dev Spaces User Namespace via Argo CD Helm Chart
          description: >
            Reads charts/devspaces-user-namespaces/values.yaml in the GitOps repo.
            If userSlug already exists under users:, skips the Git update and reuses
            their existing namespace. Otherwise appends the user to values.yaml and
            pushes to Git so Argo CD provisions the namespace via Helm.
          type: boolean
          default: true
        openShiftUser:
          title: OpenShift Username (che.eclipse.org/username & RoleBinding target)
          description: Exact OpenShift user identity (e.g. cluster-admin, alice, bob).
          type: string
          default: cluster-admin
        userSlug:
          title: DNS-Safe User Key in values.yaml (${user})
          description: Key looked up under `users:` in charts/devspaces-user-namespaces/values.yaml.
          type: string
          default: cluster-admin
          pattern: '^[a-z0-9]([-a-z0-9]{0,20}[a-z0-9])?$'
        namespaceSuffix:
          title: Random Suffix for New Namespace (${random})
          description: Used ONLY if this user does not already exist in charts/devspaces-user-namespaces/values.yaml.
          type: string
          default: n8k3p
          pattern: '^[a-z0-9]{4,8}$'
        devSpacesBaseUrl:
          title: OpenShift Dev Spaces URL
          type: string
          default: https://devspaces.apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com

    - title: 3. Command Centre Tabs & Multi-Cluster Runtime Wiring
      properties:
        telemetryBindingMode:
          title: Command Centre Telemetry Binding Mode
          description: >
            Choose whether the scaffolded catalog entity binds directly to its own
            newly deployed Argo CD Application, Kubernetes pods in demo-dev, and
            Jenkins pipeline (demo/<appName>), or binds to the multi-cluster shared
            platform baseline telemetry.
          type: string
          default: dedicated-app-identifiers
          enum:
            - dedicated-app-identifiers
            - live-platform-baseline
          enumNames:
            - "Dedicated Live App Deployment (Recommended — wires to your new Argo CD app in demo-dev & Jenkins job demo/<appName>)"
            - "Multi-Cluster Platform Baseline Telemetry (Binds K8s/Argo/Jenkins to shared multi-cluster demo baseline)"
        port:
          title: Application HTTP Port
          type: integer
          default: 3000
        targetNamespace:
          title: Kiali Service Mesh & Helm Deploy Namespace
          description: Used for Kiali mesh graph and Helm chart README (backstage.io/kubernetes-namespace is omitted for multi-cluster label discovery).
          type: string
          default: demo-dev
        clusterBaseDomain:
          title: OpenShift Apps Domain
          type: string
          default: apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com
        sonarHostUrl:
          title: SonarQube URL
          type: string
          default: http://sonarqube.sonarqube.svc:9000
        vaultNamespace:
          title: HashiCorp Vault Enterprise Namespace
          type: string
          default: payments/nonprod
        vaultSecretsPath:
          title: Vault KV v2 Secrets Path
          type: string
          default: ledger-service
        jiraProjectKey:
          title: Jira Project Key
          type: string
          default: SCRUM
        pagerDutyServiceId:
          title: PagerDuty Service ID
          type: string
          default: P123456
        serviceNowEntityId:
          title: ServiceNow CMDB CI Identifier
          type: string
          default: demo
        dynatraceEntityId:
          title: Dynatrace Service Entity ID
          type: string
          default: SERVICE-39720C1E0047A5C0

  steps:
    - id: fetch-devspaces-values
      name: Fetch charts/devspaces-user-namespaces/values.yaml from GitOps Repo
      action: fetch:plain:file
      input:
        url: https://github.com/${{ parameters.githubOwner }}/${{ parameters.gitopsRepoName }}/blob/main/charts/devspaces-user-namespaces/values.yaml
        targetPath: ./devspaces-ns-chart/values.yaml

    - id: parse-devspaces-values
      name: Check if User Already Has a Dev Spaces Namespace in values.yaml
      action: roadiehq:utils:fs:parse
      input:
        path: ./devspaces-ns-chart/values.yaml
        parser: yaml

    - id: log-namespace-decision
      name: Evaluate Dev Spaces Namespace Reuse vs Provisioning
      action: debug:log
      input:
        message: >-
          User '${{ parameters.userSlug }}' lookup in charts/devspaces-user-namespaces/values.yaml:
          ${{ 'FOUND existing namespace (' + steps['parse-devspaces-values'].output.content.users[parameters.userSlug].namespace + ') -> SKIPPING GitOps values.yaml update and reusing existing namespace!' if steps['parse-devspaces-values'].output.content.users[parameters.userSlug] else ('NOT FOUND -> Will append user ' + parameters.userSlug + ' with namespace ' + parameters.userSlug + '-devspaces-' + parameters.namespaceSuffix + ' to charts/devspaces-user-namespaces/values.yaml and push to GitOps!') }}

    - id: fetch-skeleton
      name: Scaffold Node.js 20 Code, Jenkinsfile, SonarQube, Helm Chart & Command Centre Catalog
      action: fetch:template
      input:
        url: https://github.com/${{ parameters.githubOwner }}/${{ parameters.gitopsRepoName }}/tree/main/golden-path/skeletons/skeleton-nodejs-golden-path
        targetPath: ./app-repo
        values:
          appId: ${{ parameters.appId }}
          groupName: ${{ parameters.groupName }}
          appName: ${{ parameters.appName }}
          appDescription: ${{ parameters.appDescription }}
          githubOwner: ${{ parameters.githubOwner }}
          gitopsRepoName: ${{ parameters.gitopsRepoName }}
          systemName: ${{ parameters.systemName }}
          systemDescription: ${{ parameters.systemDescription }}
          port: ${{ parameters.port }}
          targetNamespace: ${{ parameters.targetNamespace }}
          clusterBaseDomain: ${{ parameters.clusterBaseDomain }}
          sonarHostUrl: ${{ parameters.sonarHostUrl }}
          devSpacesBaseUrl: ${{ parameters.devSpacesBaseUrl }}
          workspaceNamespace: ${{ steps['parse-devspaces-values'].output.content.users[parameters.userSlug].namespace if steps['parse-devspaces-values'].output.content.users[parameters.userSlug] else (parameters.userSlug + '-devspaces-' + parameters.namespaceSuffix) }}
          kubernetesId: ${{ 'payments-checkout-service' if parameters.telemetryBindingMode === 'live-platform-baseline' else parameters.appName }}
          argocdAppSelector: ${{ 'app=plugin-kitchen-sink' if parameters.telemetryBindingMode === 'live-platform-baseline' else ('backstage-name=' + parameters.appName) }}
          jenkinsJobFullName: ${{ 'demo/plugin-kitchen-sink' if parameters.telemetryBindingMode === 'live-platform-baseline' else ('demo/' + parameters.appName) }}
          sonarProjectKey: ${{ 'demo-plugin-kitchen-sink' if parameters.telemetryBindingMode === 'live-platform-baseline' else 'demo-plugin-kitchen-sink' }}
          artifactoryImageName: ${{ 'plugin-kitchen-sink' if parameters.telemetryBindingMode === 'live-platform-baseline' else 'plugin-kitchen-sink' }}
          vaultNamespace: ${{ parameters.vaultNamespace }}
          vaultSecretsPath: ${{ parameters.vaultSecretsPath }}
          jiraProjectKey: ${{ parameters.jiraProjectKey }}
          pagerDutyServiceId: ${{ parameters.pagerDutyServiceId }}
          serviceNowEntityId: ${{ parameters.serviceNowEntityId }}
          dynatraceEntityId: ${{ parameters.dynatraceEntityId }}

    - id: create-github-repo
      name: Create Node.js Service Repository on GitHub
      action: github:repo:create
      input:
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.appName }}
        description: "${{ parameters.appDescription }} [APPID: ${{ parameters.appId }} | Owner: ${{ parameters.groupName }}]"
        defaultBranch: main
        repoVisibility: public

    - id: register-jenkins-webhook
      name: Wire GitHub Webhook to Jenkins Organization Folder (Auto-Scans & Builds demo/${{ parameters.appName }} Right Away)
      action: github:webhook
      input:
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.appName }}
        webhookUrl: https://jenkins-jenkins.${{ parameters.clusterBaseDomain }}/github-webhook/
        events:
          - push
          - pull_request
          - create
          - repository
        active: true
        contentType: json
        insecureSsl: true

    - id: publish
      name: Push Node.js Service & Thin Helm Chart to GitHub (Triggers Jenkins Build #1 Immediately via Webhook)
      action: github:repo:push
      input:
        sourcePath: ./app-repo
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.appName }}
        defaultBranch: main
        protectDefaultBranch: false
        protectEnforceAdmins: false
        gitCommitMessage: "feat(${{ parameters.appId }}): scaffold Node.js 20 golden path service ${{ parameters.appName }}"

    - id: create-argocd-app
      name: Wire Application to Argo CD & Auto-Deploy Thin Helm Chart to Dev Namespace (${{ parameters.targetNamespace }})
      action: argocd:create-resources
      input:
        appName: ${{ parameters.appName }}
        argoInstance: nonprod-argo
        namespace: ${{ parameters.targetNamespace }}
        repoUrl: https://github.com/${{ parameters.githubOwner }}/${{ parameters.appName }}.git
        path: chart
        projectName: default
        labelValue: ${{ parameters.appName }}

    - id: register
      name: Register Component, OpenAPI Spec & System in RHDH Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: append-user-to-devspaces-values
      name: Update charts/devspaces-user-namespaces/values.yaml with New User (Skipped if User Already Exists)
      if: ${{ parameters.provisionDevSpaces and (not steps['parse-devspaces-values'].output.content.users[parameters.userSlug]) }}
      action: roadiehq:utils:fs:append
      input:
        path: ./devspaces-ns-chart/values.yaml
        content: |2

            ${{ parameters.userSlug }}:
              openShiftUser: ${{ parameters.openShiftUser | dump }}
              namespace: ${{ (parameters.userSlug + "-devspaces-" + parameters.namespaceSuffix) | dump }}
              appId: ${{ parameters.appId | dump }}
              groupName: ${{ parameters.groupName | dump }}
              initialAppName: ${{ parameters.appName | dump }}
              initialAppRepoUrl: ${{ ("https://github.com/" + parameters.githubOwner + "/" + parameters.appName + ".git") | dump }}
              initialAppPort: ${{ parameters.port }}
              runtimeCommand: "node server.js"

    - id: publish-devspaces-values-pr
      name: Push Updated values.yaml to GitOps Repo for Argo CD Helm Reconciliation (Skipped if User Already Exists)
      if: ${{ parameters.provisionDevSpaces and (not steps['parse-devspaces-values'].output.content.users[parameters.userSlug]) }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.gitopsRepoName }}
        branchName: rhdh/devspaces-user-${{ parameters.userSlug }}-${{ parameters.appName }}
        targetBranchName: main
        sourcePath: ./devspaces-ns-chart
        targetPath: charts/devspaces-user-namespaces
        title: "feat(devspaces): provision Helm user namespace ${{ parameters.userSlug }}-devspaces-${{ parameters.namespaceSuffix }} for ${{ parameters.openShiftUser }} [${{ parameters.appId }}]"
        commitMessage: "feat(devspaces): add ${{ parameters.userSlug }} to charts/devspaces-user-namespaces/values.yaml [${{ parameters.appId }}]"
        description: |
          ## Automated RHDH Golden Path — Dev Spaces User Namespace Helm Update
          - **Application ID (`APPID`):** `${{ parameters.appId }}`
          - **Owning Squad (`groupName`):** `${{ parameters.groupName }}`
          - **OpenShift User:** `${{ parameters.openShiftUser }}` (`users.${{ parameters.userSlug }}`)
          - **Provisioned Namespace:** `${{ parameters.userSlug }}-devspaces-${{ parameters.namespaceSuffix }}`
          - **Argo CD Application:** `devspaces-user-namespaces` (`charts/devspaces-user-namespaces`)
        update: true

  output:
    text:
      - title: Node.js Golden Path & Dev Spaces Workspace Summary
        content: |
          ### 1. Application & Catalog Registration
          - **Application ID (`APPID`):** `${{ parameters.appId }}`
          - **Owning Squad (`groupName`):** `${{ parameters.groupName }}`
          - **GitHub Repository:** ${{ steps['publish'].output.remoteUrl }}
          - **Catalog Entity:** `${{ steps['register'].output.entityRef }}` (with OpenAPI `${{ parameters.appName }}-api` & System `${{ parameters.systemName }}`)

          ### 2. Automated Argo CD Deployment & Jenkins CI Pipeline Wiring
          - **Argo CD Application:** `${{ parameters.appName }}` (`nonprod-argo`, auto-syncing `/chart` with `idp-service-chart:1.0.0` dependency into namespace `${{ parameters.targetNamespace }}`)
          - **Jenkins Pipeline:** `demo/${{ parameters.appName }}` (GitHub webhook registered to `https://jenkins-jenkins.${{ parameters.clusterBaseDomain }}/github-webhook/` and triggered on initial commit)

          ### 3. Dev Spaces Namespace Check (`charts/devspaces-user-namespaces/values.yaml`)
          - **Status:** ${{ 'Reused existing namespace `' + steps['parse-devspaces-values'].output.content.users[parameters.userSlug].namespace + '` (User `' + parameters.userSlug + '` already present in values.yaml — GitOps update skipped!)' if steps['parse-devspaces-values'].output.content.users[parameters.userSlug] else ('Added user `' + parameters.userSlug + '` (`' + parameters.userSlug + '-devspaces-' + parameters.namespaceSuffix + '`) to `charts/devspaces-user-namespaces/values.yaml` -> pushed to GitOps PR: ' + steps['publish-devspaces-values-pr'].output.remoteUrl) }}

          ### 4. Command Centre Tabs Configured on This Entity
          | Tab | Configured Integrations |
          | :--- | :--- |
          | **Overview** | Bento Grid: Links + About (`APPID`), Multi-Cluster Argo CD Summary, Vault Enterprise Namespace Card, Jenkins Latest Run, SonarQube Gate, PagerDuty On-Call |
          | **CI/CD** | Multi-Cluster Argo CD (`nonprod-argo` & `prod-argo`), Jenkins Pipeline (`/Jenkinsfile`), Tekton |
          | **Quality & Security** | SonarQube (`/sonar-project.properties`), Vault Enterprise (`${{ parameters.vaultNamespace }}`), JFrog Artifactory |
          | **Runtime** | OpenShift Topology, Multi-Cluster Kubernetes (`backstage.io/kubernetes-id` — no namespace lock-in!), Kiali Ambient Mesh (`/chart`) |
          | **Operations** | Dynatrace, PagerDuty, Jira (`${{ parameters.jiraProjectKey }}`), ServiceNow CMDB (`${{ parameters.appId }}`) |
          | **Docs** | TechDocs (`/mkdocs.yml` & `/docs/index.md`) |
    links:
      - title: Open Component Command Centre in RHDH
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Open in Dev Spaces (Pinned to User Namespace)
        icon: dashboard
        url: ${{ parameters.devSpacesBaseUrl }}#https://github.com/${{ parameters.githubOwner }}/${{ parameters.appName }}?new&devfilePath=devfile.yaml&namespace=${{ steps['parse-devspaces-values'].output.content.users[parameters.userSlug].namespace if steps['parse-devspaces-values'].output.content.users[parameters.userSlug] else (parameters.userSlug + '-devspaces-' + parameters.namespaceSuffix) }}
      - title: Open Existing DevWorkspace in Dev Spaces IDE
        icon: code
        url: ${{ parameters.devSpacesBaseUrl }}/dashboard/#/ide/${{ steps['parse-devspaces-values'].output.content.users[parameters.userSlug].namespace if steps['parse-devspaces-values'].output.content.users[parameters.userSlug] else (parameters.userSlug + '-devspaces-' + parameters.namespaceSuffix) }}/${{ parameters.appName }}
      - title: GitHub Application Repository
        icon: github
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: catalog-info.yaml
        icon: github
        url: ${{ steps['publish'].output.repoContentsUrl }}/catalog-info.yaml
      - title: Helm Chart & Ambient Mesh (/chart)
        icon: github
        url: ${{ steps['publish'].output.repoContentsUrl }}/chart
      - title: Jenkinsfile CI/CD Pipeline
        icon: github
        url: ${{ steps['publish'].output.repoContentsUrl }}/Jenkinsfile
      - title: Dev Spaces User Namespaces Helm values.yaml
        icon: github
        url: https://github.com/${{ parameters.githubOwner }}/${{ parameters.gitopsRepoName }}/blob/main/charts/devspaces-user-namespaces/values.yaml
