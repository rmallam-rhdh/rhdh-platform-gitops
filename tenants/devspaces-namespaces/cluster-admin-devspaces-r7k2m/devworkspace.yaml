apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: rhdh-gitops-ns-demo
  namespace: cluster-admin-devspaces-r7k2m
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
    rhdh.redhat.com/app: rhdh-gitops-ns-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    che.eclipse.org/che-editor: che-incubator/che-code/latest
spec:
  started: false
  routingClass: che
  template:
    attributes:
      controller.devfile.io/devworkspace-config:
        name: devworkspace-config
        namespace: openshift-devspaces
      controller.devfile.io/storage-type: per-user
    projects:
      - name: rhdh-gitops-ns-demo
        git:
          remotes:
            origin: https://github.com/rmallam-rhdh/rhdh-gitops-ns-demo.git
    components:
      - name: udi-tools
        container:
          image: registry.redhat.io/devspaces/udi-rhel9:3.30
          memoryLimit: 3Gi
          memoryRequest: 512Mi
          cpuLimit: 2000m
          cpuRequest: 250m
          mountSources: true
          sourceMapping: /projects
          env:
            - name: PORT
              value: "3000"
          endpoints:
            - name: http-app
              targetPort: 3000
              exposure: public
              protocol: https
    commands:
      - id: run-app
        exec:
          component: udi-tools
          commandLine: node server.js
          workingDir: ${PROJECT_SOURCE}
