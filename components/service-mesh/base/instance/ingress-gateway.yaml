---
# Shared ingress gateway — one pool for all apps (RHDH, bookinfo, golden paths).
# Lives in istio-system (non-ambient); apps keep Gateway + VirtualService in their own namespaces.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: istio-ingressgateway
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
    app: istio-ingressgateway
    istio: ingressgateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 2
  selector:
    matchLabels:
      istio: ingressgateway
  template:
    metadata:
      annotations:
        inject.istio.io/templates: gateway
        prometheus.io/path: /stats/prometheus
        prometheus.io/port: "15020"
        prometheus.io/scrape: "true"
      labels:
        app: istio-ingressgateway
        istio: ingressgateway
        istio.io/rev: default          # must match Istio CR / revision name
        istio.io/dataplane-mode: none   # gateway proxy only — not ambient ztunnel
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: istio-ingressgateway
      containers:
        - name: istio-proxy
          image: auto
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: istio-ingressgateway
  namespace: istio-system
  labels:
    app: istio-ingressgateway
    istio: ingressgateway
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  selector:
    istio: ingressgateway
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
    - name: http2
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: istio-ingressgateway
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: acme-platform
  annotations:
    argocd.argoproj.io/sync-wave: "3"
