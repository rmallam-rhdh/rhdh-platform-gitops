---
# ZTunnel — per-node DaemonSet that handles transparent L4 mTLS in ambient mode.
# All pods in ambient-labelled namespaces get mTLS for free — no sidecar needed.
apiVersion: sailoperator.io/v1alpha1
kind: ZTunnel
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
spec:
  namespace: ztunnel
  profile: ambient
