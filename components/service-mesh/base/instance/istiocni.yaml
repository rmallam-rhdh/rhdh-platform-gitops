---
# IstioCNI — configures the CNI plugin for transparent traffic interception.
# Required for ambient mode so ztunnel can capture pod traffic without sidecar injection.
apiVersion: sailoperator.io/v1
kind: IstioCNI
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
spec:
  namespace: istio-cni
  profile: ambient
  version: v1.27.3
  values:
    cni:
      istioOwnedCNIConfig: true
