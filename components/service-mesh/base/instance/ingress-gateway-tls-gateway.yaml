---
# Platform ingress Gateway — terminates corporate TLS at Envoy (credential from Vault).
# Per-app VirtualServices (in app namespaces) attach to this Gateway by name reference
# OR define their own Gateway CR with the same selector (istio: ingressgateway).
#
# Traffic: Browser --corp TLS--> Route (passthrough) --> Gateway:443 --HBONE/mesh--> app
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: platform-ingressgateway
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: istio-ingressgateway-certs
      hosts:
        - "*.apps.${CLUSTER_BASE_DOMAIN}"
        - "rhdh.apps.${CLUSTER_BASE_DOMAIN}"
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*.apps.${CLUSTER_BASE_DOMAIN}"
      tls:
        httpsRedirect: true
