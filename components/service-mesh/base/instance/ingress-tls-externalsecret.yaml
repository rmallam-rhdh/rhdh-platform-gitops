---
# North-south TLS — corporate cert presented to browsers at the ingress gateway.
#
# Vault paths:
#   vault kv put kv/secrets/mesh/ingress-tls-cert  value=@tls.crt
#   vault kv put kv/secrets/mesh/ingress-tls-key   value=@tls.key
#   vault kv put kv/secrets/mesh/ingress-tls-ca    value=@ca-chain.crt   # optional
#
# Referenced by Gateway servers[].tls.credentialName (see ingress-gateway-tls-gateway.yaml).
# OpenShift Route uses passthrough so the acme sees this cert, not the cluster *.apps cert.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: istio-ingressgateway-tls
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: istio-ingressgateway-certs
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .tlsCert }}"
        tls.key: "{{ .tlsKey }}"
        ca.crt: "{{ .tlsCa | default \"\" }}"
  data:
    - secretKey: tlsCert
      remoteRef:
        key: secrets/mesh/ingress-tls-cert
        property: value
    - secretKey: tlsKey
      remoteRef:
        key: secrets/mesh/ingress-tls-key
        property: value
    - secretKey: tlsCa
      remoteRef:
        key: secrets/mesh/ingress-tls-ca
        property: value
