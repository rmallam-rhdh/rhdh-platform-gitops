---
# Mesh CA — corporate / acme PKI for Istio mTLS (replaces self-signed istio-ca-secret).
#
# Vault paths (seed before deploy):
#   vault kv put kv/secrets/mesh/ca-cert      value=@ca-cert.pem
#   vault kv put kv/secrets/mesh/ca-key       value=@ca-key.pem
#   vault kv put kv/secrets/mesh/cert-chain   value=@cert-chain.pem
#   vault kv put kv/secrets/mesh/root-cert    value=@root-cert.pem
#
# istiod mounts Secret "cacerts" and signs workload SPIFFE certs (ztunnel, gateways, HBONE).
# After first sync or rotation: restart istiod → ztunnel → ingress gateways (see rollout job).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: istio-mesh-ca
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-secret-store
  target:
    name: cacerts
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ca-cert.pem: "{{ .caCert }}"
        ca-key.pem: "{{ .caKey }}"
        cert-chain.pem: "{{ .certChain }}"
        root-cert.pem: "{{ .rootCert }}"
  data:
    - secretKey: caCert
      remoteRef:
        key: secrets/mesh/ca-cert
        property: value
    - secretKey: caKey
      remoteRef:
        key: secrets/mesh/ca-key
        property: value
    - secretKey: certChain
      remoteRef:
        key: secrets/mesh/cert-chain
        property: value
    - secretKey: rootCert
      remoteRef:
        key: secrets/mesh/root-cert
        property: value
