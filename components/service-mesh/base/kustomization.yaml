---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ── Namespaces ─────────────────────────────────────────────────────────────
  - namespace.yaml                              # istio-system, istio-cni, ztunnel

  # ── User Workload Monitoring (wave 0) ──────────────────────────────────────
  - instance/cluster-monitoring-config.yaml     # enableUserWorkload=true (Kiali prereq)

  # ── Custom CatalogSource (wave 0) ──────────────────────────────────────────
  - operator/catalogsource-snapshot.yaml        # redhat-operators-snapshot

  # ── Operator subscriptions (wave 1) ────────────────────────────────────────
  - operator/subscription-kiali.yaml
  - operator/subscription-servicemesh.yaml

  # ── PKI / TLS (wave 2) — must exist before istiod consumes plug-in CA ───────
  - instance/mesh-ca-externalsecret.yaml        # Vault → cacerts (mesh mTLS CA)
  - instance/ingress-tls-externalsecret.yaml    # Vault → istio-ingressgateway-certs

  # ── Sail Operator control-plane CRs (waves 2-3) ───────────────────────────
  - instance/istiocni.yaml                      # CNI plugin (wave 2)
  - instance/istio.yaml                         # Istio control plane, ambient (wave 3)
  - instance/ztunnel.yaml                       # ZTunnel DaemonSet (wave 3)

  # ── Shared ingress gateway (waves 3-5) ─────────────────────────────────────
  - instance/ingress-gateway.yaml               # istio-ingressgateway in istio-system
  - instance/ingress-gateway-tls-gateway.yaml   # corp TLS termination at Envoy
  - instance/mesh-ca-rollout.yaml               # PostSync: sync root cert + restart

  # ── Kiali + observability (waves 4-5) ──────────────────────────────────────
  - instance/kiali.yaml                         # Kiali CR (wave 4)
  - instance/telemetry.yaml                     # ServiceMonitors + RBAC + OSSMConsole

commonLabels:
  app.kubernetes.io/managed-by: openshift-gitops
  app.kubernetes.io/part-of: acme-platform
