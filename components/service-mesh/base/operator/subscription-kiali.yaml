---
# Kiali Operator — must use redhat-operators-snapshot to match OSSM3.
# Channel: stable (pairs with servicemeshoperator3 stable-3.2).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kiali-operator
  namespace: openshift-operators
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: service-mesh
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  channel: stable
  installPlanApproval: Automatic
  name: kiali-ossm
  source: redhat-operators-snapshot
  sourceNamespace: openshift-marketplace
