---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Production patch — pin to a specific Istio version, no auto-upgrades.
patches:
  - target:
      group: sailoperator.io
      version: v1
      kind: Istio
      name: default
    patch: |-
      - op: replace
        path: /spec/updateStrategy/type
        value: RevisionBased   # safer for prod: new revision before cutover

commonLabels:
  environment: production
