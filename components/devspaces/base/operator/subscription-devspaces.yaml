---
# Red Hat OpenShift Dev Spaces Operator — browser IDE workspaces on OpenShift (eDev / Non-Prod).
# Installs Dev Workspace Operator as a dependency.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: devspaces
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: devspaces
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  channel: stable
  installPlanApproval: Automatic
  name: devspaces
  source: redhat-operators
  sourceNamespace: openshift-marketplace
