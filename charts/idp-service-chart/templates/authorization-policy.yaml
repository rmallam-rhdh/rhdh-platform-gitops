{{- if and .Values.mesh.enabled .Values.mesh.denyAll }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "app.name" . }}-deny-all
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec: {}
---
# North-south only: shared or per-app ingress gateway.
# Applied directly to the workload pod selector so ztunnel permits HBONE traffic
# when an Istio ingress gateway forwards directly to the pod IP.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "app.name" . }}-allow-ingress
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s-%s-istio" .Values.mesh.gateway.namespace (include "app.name" .) .Release.Namespace | quote }}
              {{- range .Values.mesh.ingressPrincipals }}
              - {{ . | quote }}
              {{- end }}
      to:
        - operation:
            ports:
              - {{ .Values.service.port | quote }}
{{- if .Values.mesh.waypoint.enabled }}
---
# Ambient L7: waypoint identity is what ztunnel sees on the workload.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "app.name" . }}-allow-waypoint
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "app.name" . }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" .Release.Namespace (include "app.waypointName" .) | quote }}
      to:
        - operation:
            ports:
              - {{ .Values.service.port | quote }}
{{- end }}
{{- end }}
