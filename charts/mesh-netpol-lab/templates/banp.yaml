{{- if .Values.banp.enabled }}
apiVersion: policy.networking.k8s.io/v1alpha1
kind: BaselineAdminNetworkPolicy
metadata:
  name: default
spec:
  subject:
    namespaces:
      matchLabels:
        westpac.co.nz/belongs-to: wnzlspace
  egress:
  - name: deny-egress-listed
    action: Deny
    to:
    - networks:
      {{- range .Values.banp.denyEgressTo }}
      - {{ . }}
      {{- end }}
{{- end }}
