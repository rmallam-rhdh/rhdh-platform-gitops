apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.client }}
  labels:
    istio.io/dataplane-mode: ambient
    istio-discovery: enabled
    {{- if .Values.banp.enabled }}
    westpac.co.nz/belongs-to: wnzlspace
    {{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.server }}
  labels:
    istio.io/dataplane-mode: ambient
    {{- if .Values.namespaces.serverDiscoveryLabel }}
    istio-discovery: enabled
    {{- end }}
    {{- if .Values.waypoint.enabled }}
    istio.io/use-waypoint: waypoint
    {{- end }}
    {{- if .Values.banp.enabled }}
    westpac.co.nz/belongs-to: wnzlspace
    {{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespaces.outside }}
