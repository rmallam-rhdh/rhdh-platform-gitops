# Example only — not applied by the Dev Spaces Helm chart.
# Option A: rewrite default Operator image host/org for a restricted registry.
#
# Expectation:
#   registry.redhat.io/devspaces/<image>:<tag>
#     → artifactory.example.com/digi20/devspaces/<image>:<tag>
#
# Mirror layout must match that rewrite. Prefer ImageDigestMirrorSet when the
# cluster already rewrites registry.redhat.io globally.
---
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: devspaces
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/name: devspaces
    app.kubernetes.io/part-of: idp-platform
    app.kubernetes.io/component: devspaces-example
spec:
  containerRegistry:
    hostname: artifactory.example.com
    organization: digi20/devspaces

  components:
    cheServer:
      debug: false
      logLevel: INFO
    dashboard:
      logLevel: ERROR
    metrics:
      enable: true

  devEnvironments:
    defaultEditor: che-incubator/che-code/latest
    defaultNamespace:
      autoProvision: true
      template: <username>-devspaces
    persistUserHome:
      enabled: true
    disableContainerBuildCapabilities: false
    disableContainerRunCapabilities: true
    maxNumberOfWorkspacesPerUser: 5
    maxNumberOfRunningWorkspacesPerUser: 1
    secondsOfInactivityBeforeIdling: 1800
    secondsOfRunBeforeIdling: -1
    startTimeoutSeconds: 300
    storage:
      pvcStrategy: per-user
      perUserStrategyPvcConfig:
        claimSize: 10Gi
        storageAccessMode:
          - ReadWriteOnce

  networking:
    networkPolicy:
      enabled: true
