# Lab-only. Not a stand-in for customer Active Directory.
# Build images first: ./charts/kerberos-lab/scripts/build-images.sh

namespace: kerberos-lab
createNamespace: true
realm: LAB.LOCAL
# Must match Service DNS used in SPNs.
corporateProxyHostname: corporate-proxy.kerberos-lab.svc.cluster.local
bridgeHostname: bridge.kerberos-lab.svc.cluster.local

images:
  # Built by scripts/build-images.sh and pushed to your registry.
  # Defaults assume a local/kind tag; override for the cluster.
  kdc: kerberos-lab-kdc:0.1.0
  corporateProxy: kerberos-lab-corporate-proxy:0.1.0
  bridge: kerberos-lab-bridge:0.1.0
  pullPolicy: IfNotPresent

kdc:
  replicas: 1

corporateProxy:
  port: 3128
  # Parent auth challenge: negotiate (Kerberos) | ntlm (lab fake NTLM helper).
  authMode: negotiate
  # Destinations the "corporate" proxy may CONNECT to (lab allow list).
  # Squid rejects mixing example.com and .example.com on the same ACL.
  allow:
    - .example.com
    - .httpbin.org
    - ifconfig.me
    - .github.com
    - .atlassian.net
    - .atlassian.com
    - .service-now.com

# Lab-only NTLM credentials for bridge → corporate-proxy when authMode=ntlm.
# Fake corporate helper accepts any password; these must still match what cntlm sends.
ntlm:
  createSecret: true
  secretName: kerberos-bridge-ntlm
  username: labntlm
  password: labntlm-pass
  domain: LAB

bridge:
  # Standalone Deployment (debug only). Prefer Hub sidecar; leave false.
  # Do not pair UBI loopback image with this Deployment + Service.
  enabled: false
  port: 3128
  # kerberos | ntlm — used when bridge.enabled=true (standalone debug).
  proxyAuthMode: kerberos

# PostSync Job: copy KDC keytab into Hub namespace Secret for the sidecar.
keytabSync:
  enabled: true
  hubNamespace: rhdh-kerberos
  secretName: kerberos-bridge-keytab
  kubectlImage: registry.redhat.io/openshift4/ose-cli:latest

networkPolicy:
  # Hub namespaces whose pods (sidecars) may reach corporate-proxy.
  allowFromNamespaces:
    - rhdh-kerberos
