apiVersion: v1
kind: ServiceAccount
metadata:
  name: kerberos-lab
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
---
# Squid images run as uid 13 (proxy); KDC init needs to write keytabs.
# Same pattern as charts/squid.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kerberos-lab-anyuid
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: kerberos-lab
    namespace: {{ .Values.namespace }}
