{{- if .Values.bridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: bridge
spec:
  selector:
    app.kubernetes.io/component: bridge
  ports:
    - name: proxy
      port: {{ .Values.bridge.port }}
      targetPort: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
    app.kubernetes.io/component: bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: bridge
  template:
    metadata:
      labels:
        {{- include "kerberos-lab.labels" . | nindent 8 }}
        app.kubernetes.io/component: bridge
      annotations:
        kerberos-lab/auth-mode: {{ .Values.bridge.proxyAuthMode | quote }}
    spec:
      serviceAccountName: kerberos-lab
      securityContext:
        runAsNonRoot: true
        runAsUser: 13
        runAsGroup: 13
        fsGroup: 13
      {{- if ne (.Values.bridge.proxyAuthMode | default "kerberos") "ntlm" }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: kdc
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-keytab
          image: {{ .Values.images.kdc | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["sh", "-c", "until test -f /keytabs/bridge-client.keytab; do echo waiting for bridge-client.keytab; sleep 3; done"]
          volumeMounts:
            - name: keytabs
              mountPath: /keytabs
              readOnly: true
      {{- end }}
      containers:
        - name: squid
          image: {{ .Values.images.bridge | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: PROXY_AUTH_MODE
              value: {{ .Values.bridge.proxyAuthMode | default "kerberos" | quote }}
            - name: REALM
              value: {{ .Values.realm | quote }}
            - name: KDC_HOSTNAME
              value: kdc.{{ .Values.namespace }}.svc.cluster.local
            - name: CORPORATE_PROXY_HOSTNAME
              value: corporate-proxy.{{ .Values.namespace }}.svc.cluster.local
            - name: CORPORATE_PROXY_PORT
              value: {{ .Values.corporateProxy.port | quote }}
            - name: KRB5_KTNAME
              value: /keytabs/bridge-client.keytab
            - name: BRIDGE_CLIENT_PRINCIPAL
              value: rhdh-bridge@{{ .Values.realm }}
            {{- if eq (.Values.bridge.proxyAuthMode | default "kerberos") "ntlm" }}
            # Standalone Service needs a non-loopback listen; NetworkPolicy still gates peers.
            - name: BRIDGE_LISTEN_ADDR
              value: "0.0.0.0"
            - name: NTLM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ntlm.secretName | quote }}
                  key: username
            - name: NTLM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ntlm.secretName | quote }}
                  key: password
            - name: NTLM_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ntlm.secretName | quote }}
                  key: domain
            {{- end }}
          ports:
            - name: proxy
              containerPort: {{ .Values.bridge.port }}
          readinessProbe:
            {{- if eq (.Values.bridge.proxyAuthMode | default "kerberos") "ntlm" }}
            # cntlm binds 0.0.0.0 in standalone NTLM mode — kubelet tcpSocket works.
            tcpSocket:
              port: proxy
            {{- else }}
            # Kerberos Squid binds 127.0.0.1 only.
            exec:
              command: ["bash", "-c", "echo >/dev/tcp/127.0.0.1/{{ .Values.bridge.port }}"]
            {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- if ne (.Values.bridge.proxyAuthMode | default "kerberos") "ntlm" }}
          volumeMounts:
            - name: keytabs
              mountPath: /keytabs
              readOnly: true
          {{- end }}
      {{- if ne (.Values.bridge.proxyAuthMode | default "kerberos") "ntlm" }}
      volumes:
        - name: keytabs
          persistentVolumeClaim:
            claimName: kerberos-lab-keytabs
      {{- end }}
{{- end }}

