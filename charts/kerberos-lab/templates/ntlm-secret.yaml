{{- if eq .Values.corporateProxy.authMode "ntlm" }}
{{- if .Values.ntlm.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ntlm.secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.ntlm.username | quote }}
  password: {{ .Values.ntlm.password | quote }}
  domain: {{ .Values.ntlm.domain | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ntlm.secretName }}
  namespace: {{ .Values.keytabSync.hubNamespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.ntlm.username | quote }}
  password: {{ .Values.ntlm.password | quote }}
  domain: {{ .Values.ntlm.domain | quote }}
{{- end }}
{{- end }}
