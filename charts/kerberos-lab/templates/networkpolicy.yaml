{{- if .Values.bridge.enabled }}
# Standalone bridge accepts Hub traffic only from listed namespaces (no proxy auth on listen).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bridge-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: bridge
  policyTypes: ["Ingress"]
  ingress:
    - from:
{{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
{{- end }}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.bridge.port }}
---
{{- end }}
# Corporate proxy accepts the lab bridge pod and/or Hub sidecars in allowFromNamespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: corporate-proxy-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kerberos-lab.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: corporate-proxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        {{- if .Values.bridge.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bridge
        {{- end }}
        # Same-namespace Jobs (smoke probes) and any local debug pods.
        - podSelector: {}
{{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.corporateProxy.port }}
