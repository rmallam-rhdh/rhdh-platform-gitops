# One Certificate per catalogue entry: exactly one DNS name, never a wildcard.
# Certificates share sync wave 2 with the Gateway, Routes and HTTPRoutes on purpose. If a later wave waited
# for certificates to be healthy, one certificate that cannot be issued would block every other change.
# The gateway already isolates it: only that listener stays down (InvalidCertificateRef).
# A host with certInAppNamespace gets its Certificate (and Secret) in its own namespace, from the team issuer.
{{- range .Values.hosts }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}-{{ $.Values.namePrefix }}
  namespace: {{ if .certInAppNamespace }}{{ .namespace }}{{ else }}{{ $.Values.gateway.namespace }}{{ end }}
  labels:
    {{- include "gateway-cert-lab.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: {{ .name }}-{{ $.Values.namePrefix }}-tls
  dnsNames:
    - {{ include "gateway-cert-lab.host" (list $ .name) }}
  duration: {{ $.Values.certificate.duration }}
  privateKey:
    rotationPolicy: {{ $.Values.certificate.rotationPolicy }}
  issuerRef:
    {{- if .certInAppNamespace }}
    name: {{ $.Values.issuer.team.name }}
    kind: {{ $.Values.issuer.team.kind }}
    {{- else }}
    name: {{ $.Values.issuer.name }}
    kind: {{ $.Values.issuer.kind }}
    {{- end }}
{{- end }}
{{- if .Values.brokenHost.enabled }}
---
# Broken on purpose: the issuer does not exist, so this certificate is never issued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.brokenHost.name }}-{{ .Values.namePrefix }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "gateway-cert-lab.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: {{ .Values.brokenHost.name }}-{{ .Values.namePrefix }}-tls
  dnsNames:
    - {{ include "gateway-cert-lab.host" (list $ .Values.brokenHost.name) }}
  issuerRef:
    name: no-such-issuer
    kind: Issuer
{{- end }}
