# One Certificate per catalogue entry: exactly one DNS name, never a wildcard.
{{- range .Values.hosts }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .name }}-{{ $.Values.namePrefix }}
  namespace: {{ $.Values.gateway.namespace }}
  labels:
    {{- include "gateway-cert-lab.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: {{ .name }}-{{ $.Values.namePrefix }}-tls
  dnsNames:
    - {{ include "gateway-cert-lab.host" (list $ .name) }}
  duration: {{ $.Values.certificate.duration }}
  privateKey:
    rotationPolicy: {{ $.Values.certificate.rotationPolicy }}
  issuerRef:
    name: {{ $.Values.issuer.name }}
    kind: {{ $.Values.issuer.kind }}
{{- end }}
{{- if .Values.brokenHost.enabled }}
---
# Broken on purpose: the issuer does not exist, so this certificate is never issued.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.brokenHost.name }}-{{ .Values.namePrefix }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    {{- include "gateway-cert-lab.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  secretName: {{ .Values.brokenHost.name }}-{{ .Values.namePrefix }}-tls
  dnsNames:
    - {{ include "gateway-cert-lab.host" (list $ .Values.brokenHost.name) }}
  issuerRef:
    name: no-such-issuer
    kind: Issuer
{{- end }}
