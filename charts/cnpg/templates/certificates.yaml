{{- if and .Values.tls.enabled .Values.tls.certManager.enabled }}
{{- $ns := include "cnpg.namespace" . -}}
{{- $cluster := .Values.cluster.name -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.certManager.serverCertName }}
  namespace: {{ $ns }}
  labels:
    {{- include "cnpg.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  isCA: false
  secretName: {{ .Values.tls.serverTLSSecret }}
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  duration: {{ .Values.tls.certManager.duration | quote }}
  renewBefore: {{ .Values.tls.certManager.renewBefore | quote }}
  commonName: {{ printf "%s-rw" $cluster | quote }}
  usages:
    - server auth
  dnsNames:
    - {{ printf "%s-rw" $cluster | quote }}
    - {{ printf "%s-rw.%s" $cluster $ns | quote }}
    - {{ printf "%s-rw.%s.svc" $cluster $ns | quote }}
    - {{ printf "%s-rw.%s.svc.cluster.local" $cluster $ns | quote }}
    - {{ printf "%s-ro" $cluster | quote }}
    - {{ printf "%s-ro.%s" $cluster $ns | quote }}
    - {{ printf "%s-ro.%s.svc" $cluster $ns | quote }}
    - {{ printf "%s-ro.%s.svc.cluster.local" $cluster $ns | quote }}
    - {{ printf "%s-r" $cluster | quote }}
    - {{ printf "%s-r.%s" $cluster $ns | quote }}
    - {{ printf "%s-r.%s.svc" $cluster $ns | quote }}
    - {{ printf "%s-r.%s.svc.cluster.local" $cluster $ns | quote }}
  privateKey:
    algorithm: {{ .Values.tls.certManager.privateKey.algorithm }}
    size: {{ .Values.tls.certManager.privateKey.size }}
  issuerRef:
    name: {{ .Values.tls.certManager.issuerRef.name | quote }}
    kind: {{ .Values.tls.certManager.issuerRef.kind | quote }}
    group: {{ .Values.tls.certManager.issuerRef.group | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.tls.certManager.replicationCertName }}
  namespace: {{ $ns }}
  labels:
    {{- include "cnpg.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  isCA: false
  secretName: {{ .Values.tls.replicationTLSSecret }}
  secretTemplate:
    labels:
      cnpg.io/reload: "true"
  duration: {{ .Values.tls.certManager.duration | quote }}
  renewBefore: {{ .Values.tls.certManager.renewBefore | quote }}
  commonName: {{ .Values.tls.certManager.replicationCommonName | quote }}
  usages:
    - client auth
  privateKey:
    algorithm: {{ .Values.tls.certManager.privateKey.algorithm }}
    size: {{ .Values.tls.certManager.privateKey.size }}
  issuerRef:
    name: {{ .Values.tls.certManager.issuerRef.name | quote }}
    kind: {{ .Values.tls.certManager.issuerRef.kind | quote }}
    group: {{ .Values.tls.certManager.issuerRef.group | quote }}
{{- end }}
