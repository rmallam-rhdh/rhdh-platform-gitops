# Operator is assumed installed (Certified cloudnative-pg in cnpg-system).
namespace: rhdh
createNamespace: true

cluster:
  name: rhdh-pg
  instances: 3
  storage: 10Gi
  storageClass: ""
  imageName: ""
  maxConnections: "200"
  backup:
    enabled: true
    target: prefer-standby
    volumeSnapshot:
      className: csi-aws-vsc
      online: true
      onlineConfiguration:
        immediateCheckpoint: false
        waitForArchive: true
        snapshotOwnerReference: none
