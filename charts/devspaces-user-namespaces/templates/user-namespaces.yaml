{{- $defaults := .Values.defaults -}}
{{- range $userSlug, $u := .Values.users }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $u.namespace | quote }}
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
    app.kubernetes.io/managed-by: rhdh-gitops
    rhdh.redhat.com/user-slug: {{ $userSlug | quote }}
    {{- if $u.appId }}
    platform.idp/app-id: {{ $u.appId | quote }}
    {{- end }}
  annotations:
    che.eclipse.org/username: {{ $u.openShiftUser | quote }}
    rhdh.redhat.com/provisioned-by: devspaces-user-namespaces-helm
    {{- if $u.groupName }}
    rhdh.redhat.com/owner-group: {{ $u.groupName | quote }}
    {{- end }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: devspaces-tenant-quota
  namespace: {{ $u.namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
spec:
  hard:
    requests.cpu: {{ $defaults.quota.requestsCpu | quote }}
    requests.memory: {{ $defaults.quota.requestsMemory | quote }}
    limits.cpu: {{ $defaults.quota.limitsCpu | quote }}
    limits.memory: {{ $defaults.quota.limitsMemory | quote }}
    persistentvolumeclaims: {{ $defaults.quota.pvcs | quote }}
    pods: {{ $defaults.quota.pods | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: devspaces-container-limits
  namespace: {{ $u.namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
spec:
  limits:
    - type: Container
      default:
        cpu: {{ $defaults.limitRange.defaultCpu | quote }}
        memory: {{ $defaults.limitRange.defaultMemory | quote }}
      defaultRequest:
        cpu: {{ $defaults.limitRange.defaultRequestCpu | quote }}
        memory: {{ $defaults.limitRange.defaultRequestMemory | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: devspaces-user-admin
  namespace: {{ $u.namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: {{ $u.openShiftUser | quote }}
{{- if $u.initialAppName }}
---
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspaceTemplate
metadata:
  name: {{ printf "che-code-%s" $u.initialAppName | quote }}
  namespace: {{ $u.namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
  annotations:
    che.eclipse.org/components-update-policy: managed
    che.eclipse.org/plugin-registry-url: http://127.0.0.1:8080/dashboard/api/editors/devfile?che-editor=che-incubator/che-code/latest
spec:
  commands:
    - id: init-container-command
      apply:
        component: che-code-injector
    - id: init-che-code-command
      exec:
        component: che-code-runtime-description
        commandLine: nohup /checode/entrypoint-volume.sh > /checode/entrypoint-logs.txt 2>&1 &
  events:
    preStart:
      - init-container-command
    postStart:
      - init-che-code-command
  components:
    - name: che-code-injector
      container:
        image: {{ $defaults.codeImage | quote }}
        command: ["/entrypoint-init-container.sh"]
        cpuLimit: 500m
        cpuRequest: 30m
        memoryLimit: 256Mi
        memoryRequest: 32Mi
        sourceMapping: /projects
        volumeMounts:
          - name: checode
            path: /checode
        env:
          - name: CHE_DASHBOARD_URL
            value: {{ $defaults.devSpacesBaseUrl | quote }}
          - name: CHE_PLUGIN_REGISTRY_URL
            value: {{ printf "%s/plugin-registry/v3" $defaults.devSpacesBaseUrl | quote }}
          - name: CHE_PLUGIN_REGISTRY_INTERNAL_URL
            value: {{ $defaults.pluginRegistryInternalUrl | quote }}
          - name: OPENVSX_REGISTRY_URL
            value: ""
    - name: che-code-runtime-description
      attributes:
        app.kubernetes.io/component: che-code-runtime
        app.kubernetes.io/part-of: che-code.eclipse.org
        controller.devfile.io/container-contribution: true
      container:
        image: {{ $defaults.udiImage | quote }}
        cpuLimit: 500m
        cpuRequest: 30m
        memoryLimit: 1024Mi
        memoryRequest: 256Mi
        sourceMapping: /projects
        volumeMounts:
          - name: checode
            path: /checode
        env:
          - name: CHE_DASHBOARD_URL
            value: {{ $defaults.devSpacesBaseUrl | quote }}
          - name: CHE_PLUGIN_REGISTRY_URL
            value: {{ printf "%s/plugin-registry/v3" $defaults.devSpacesBaseUrl | quote }}
          - name: CHE_PLUGIN_REGISTRY_INTERNAL_URL
            value: {{ $defaults.pluginRegistryInternalUrl | quote }}
          - name: OPENVSX_REGISTRY_URL
            value: ""
        endpoints:
          - name: che-code
            targetPort: 3100
            exposure: public
            protocol: https
            secure: true
            attributes:
              cookiesAuthEnabled: true
              discoverable: false
              type: main
              urlRewriteSupported: true
          - name: code-redirect-1
            targetPort: 13131
            exposure: public
            protocol: https
            attributes:
              discoverable: false
              urlRewriteSupported: false
          - name: code-redirect-2
            targetPort: 13132
            exposure: public
            protocol: https
            attributes:
              discoverable: false
              urlRewriteSupported: false
          - name: code-redirect-3
            targetPort: 13133
            exposure: public
            protocol: https
            attributes:
              discoverable: false
              urlRewriteSupported: false
    - name: checode
      volume: {}
---
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspace
metadata:
  name: {{ $u.initialAppName | quote }}
  namespace: {{ $u.namespace | quote }}
  labels:
    app.kubernetes.io/managed-by: rhdh-gitops
    rhdh.redhat.com/app: {{ $u.initialAppName | quote }}
    {{- if $u.appId }}
    platform.idp/app-id: {{ $u.appId | quote }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    che.eclipse.org/che-editor: che-incubator/che-code/latest
spec:
  started: false
  routingClass: che
  contributions:
    - name: editor
      kubernetes:
        name: {{ printf "che-code-%s" $u.initialAppName | quote }}
  template:
    attributes:
      controller.devfile.io/devworkspace-config:
        name: devworkspace-config
        namespace: openshift-devspaces
      controller.devfile.io/storage-type: per-user
    projects:
      - name: {{ $u.initialAppName | quote }}
        git:
          remotes:
            origin: {{ $u.initialAppRepoUrl | quote }}
    components:
      - name: udi-tools
        container:
          image: {{ $defaults.udiImage | quote }}
          memoryLimit: 3Gi
          memoryRequest: 512Mi
          cpuLimit: 2000m
          cpuRequest: 250m
          mountSources: true
          sourceMapping: /projects
          env:
            - name: PORT
              value: {{ ($u.initialAppPort | default 8080) | toString | quote }}
            {{- if $u.appId }}
            - name: APP_ID
              value: {{ $u.appId | quote }}
            {{- end }}
          endpoints:
            - name: http-app
              targetPort: {{ $u.initialAppPort | default 8080 }}
              exposure: public
              protocol: https
    commands:
      - id: run-app
        exec:
          component: udi-tools
          commandLine: {{ $u.runtimeCommand | default "mvn quarkus:dev" | quote }}
          workingDir: ${PROJECT_SOURCE}
{{- end }}
{{- end }}
