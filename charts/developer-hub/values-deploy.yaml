# Per-cluster overlay, applied after values-demo.yaml.
# Set clusterBaseDomain to this cluster's *.apps domain before the first sync.
# baseUrl is derived from it. Do not put secrets in this file.

# Hub and Postgres stay off the mesh. Ambient capture makes kubelet probes
# to CloudNativePG port 8000 time out, so the database never goes Ready.
mesh:
  ambient: false

app:
  clusterBaseDomain: apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com
  baseUrl: ""
  devspacesBaseUrl: https://devspaces.apps.rosa.rosa-rwx5g.f8y9.p3.openshiftapps.com

# This lab already has Secret rhdh-secrets. Do not let GitOps replace it.
secrets:
  mode: external

plugins:
  snyk:
    enabled: false
  kubernetes:
    clusterName: rosa-rwx5g

instance:
  replicas: 1
  database:
    enableLocalDb: false

# The Postgres Cluster CR is charts/cnpg. This chart only reads its app Secret.
database:
  cnpg:
    enabled: false
  external:
    enabled: true
    secretName: rhdh-pg-app

# No in-cluster Squid on this cluster.
httpProxy:
  enabled: false
