# New-cluster overlay, applied after values-demo.yaml.
# Set clusterBaseDomain to this cluster's *.apps domain before the first sync.
# baseUrl is derived from it. Do not put secrets in this file.

# Hub and Postgres stay off the mesh. Ambient capture makes kubelet probes
# to CloudNativePG port 8000 time out, so the database never goes Ready.
mesh:
  ambient: false

app:
  clusterBaseDomain: apps.ocp.dkccw.sandbox3257.opentlc.com
  baseUrl: ""
  # Dev Spaces route on the ingress shard (rmallam/RHDH tools/ingress-shard).
  devspacesBaseUrl: https://devspaces.devspaces.ocp.dkccw.sandbox3257.opentlc.com

# Credentials live in Vault KV v2 at secrets/rhdh/<suffix>, property value.
# External Secrets writes Secret rhdh-secrets. Do not put secret values here.
secrets:
  mode: eso

# Private GHCR export. Omit it until a pull secret for ghcr.io/rmallam exists,
# otherwise install-dynamic-plugins fails closed and the Hub never starts.
plugins:
  snyk:
    enabled: false

instance:
  replicas: 1
  database:
    enableLocalDb: false

# The Postgres Cluster CR is charts/cnpg. This chart only reads its app Secret.
database:
  cnpg:
    enabled: false
  external:
    enabled: true
    secretName: rhdh-pg-app
