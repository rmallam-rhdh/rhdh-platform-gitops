{{- if eq .Values.secrets.mode "placeholder" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "rhdh.namespace" . }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
{{- range $key, $val := .Values.secrets.placeholders }}
  {{ $key }}: {{ $val | quote }}
{{- end }}
{{- end }}
{{- if eq .Values.secrets.mode "eso" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "rhdh.namespace" . }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ .Values.secrets.eso.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.secrets.eso.storeKind }}
    name: {{ .Values.secrets.eso.storeName }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $env, $vaultKey := .Values.secrets.keys }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.secrets.eso.vaultPrefix $vaultKey }}
        property: value
    {{- end }}
{{- end }}
