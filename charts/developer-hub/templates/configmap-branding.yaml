{{- if .Values.instance.extraFiles.branding }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh-branding
  namespace: {{ include "rhdh.namespace" . }}
  labels:
    {{- include "rhdh.labels" . | nindent 4 }}
data:
  app-config-branding.yaml: |
    app:
      title: {{ .Values.app.title | quote }}
      baseUrl: {{ include "rhdh.baseUrl" . | quote }}
      {{- if .Values.branding.enabled }}
      branding:
        {{- if and .Values.branding.logo .Values.branding.logo.fullLogoWidth }}
        fullLogoWidth: {{ .Values.branding.logo.fullLogoWidth | quote }}
        {{- end }}
        {{- if and .Values.branding.logo .Values.branding.logo.fullLogoLight .Values.branding.logo.fullLogoDark }}
        fullLogo:
          light: {{ .Values.branding.logo.fullLogoLight | quote }}
          dark: {{ .Values.branding.logo.fullLogoDark | quote }}
        {{- else if and .Values.branding.logo .Values.branding.logo.fullLogo }}
        fullLogo: {{ .Values.branding.logo.fullLogo | quote }}
        {{- end }}
        {{- if and .Values.branding.logo .Values.branding.logo.iconLogo }}
        iconLogo: {{ .Values.branding.logo.iconLogo | quote }}
        {{- end }}
        theme:
          light:
            defaultPageTheme: default
            options:
              # Ensures BackstageHeaderTabs uses explicit MUI palette text colors
              # instead of RHDH's `color: unset` inheritance bug.
              tabs: mui
            pageTheme:
              default:
                backgroundColor:
                  - {{ .Values.branding.light.headerStart | quote }}
                  - {{ .Values.branding.light.headerEnd | quote }}
                fontColor: {{ .Values.branding.light.headerFontColor | quote }}
            palette:
              primary:
                main: {{ .Values.branding.light.primaryColor | quote }}
              secondary:
                main: {{ .Values.branding.light.secondaryColor | quote }}
              text:
                primary: {{ .Values.branding.light.textPrimary | quote }}
                secondary: {{ .Values.branding.light.textSecondary | quote }}
              textSubtle: {{ .Values.branding.light.textSecondary | quote }}
              tabbar:
                indicator: {{ .Values.branding.light.primaryColor | quote }}
              background:
                default: {{ .Values.branding.light.canvasColor | quote }}
                paper: {{ .Values.branding.light.cardColor | quote }}
              navigation:
                background: {{ .Values.branding.light.shellColor | quote }}
                indicator: {{ .Values.branding.light.indicatorColor | quote }}
                color: {{ .Values.branding.light.shellTextColor | default "#334155" | quote }}
                selectedColor: {{ .Values.branding.light.shellSelectedTextColor | default "#0F172A" | quote }}
                navItem:
                  hoverBackground: {{ .Values.branding.light.shellHoverColor | quote }}
                submenu:
                  background: {{ .Values.branding.light.cardColor | quote }}
              rhdh:
                general:
                  pageInset: {{ .Values.branding.pageInset | default "1rem" | quote }}
                  pageInsetBackgroundColor: {{ .Values.branding.light.shellColor | quote }}
                  mainSectionBackgroundColor: {{ .Values.branding.light.canvasColor | quote }}
                  cardBackgroundColor: {{ .Values.branding.light.cardColor | quote }}
                  cardBorderColor: {{ .Values.branding.light.borderColor | quote }}
                  paperBorderColor: {{ .Values.branding.light.borderColor | quote }}
                  formControlBackgroundColor: {{ .Values.branding.light.cardColor | quote }}
                  sidebarBackgroundColor: {{ .Values.branding.light.shellColor | quote }}
                  sidebarDividerColor: {{ .Values.branding.light.shellBorderColor | quote }}
                  sidebarItemSelectedBackgroundColor: {{ .Values.branding.light.shellHoverColor | quote }}
                  tableBackgroundColor: {{ .Values.branding.light.cardColor | quote }}
                  tableBorderColor: {{ .Values.branding.light.shellBorderColor | default "#E5E2EE" | quote }}
                  tableRowHover: {{ .Values.branding.light.shellColor | default "#F9F8FC" | quote }}
                  tableTitleColor: {{ .Values.branding.light.textPrimary | quote }}
                  tableSubtitleColor: {{ .Values.branding.light.textSecondary | quote }}
                  tableColumnTitleColor: {{ .Values.branding.light.shellTextColor | default "#2D2A4A" | quote }}
                  tabsLinkHoverBackgroundColor: {{ .Values.branding.light.tabsHoverBg | default "rgba(218, 23, 16, 0.10)" | quote }}
                  appBarBackgroundScheme: light
                  appBarBackgroundColor: {{ .Values.branding.light.appBarColor | default "#FFFFFF" | quote }}
                  appBarForegroundColor: {{ .Values.branding.light.textPrimary | quote }}
                primary:
                  main: {{ .Values.branding.light.primaryColor | quote }}
                  focusVisibleBorder: {{ .Values.branding.light.focusPrimary | default .Values.branding.light.primaryColor | quote }}
                secondary:
                  main: {{ .Values.branding.light.secondaryColor | quote }}
                  focusVisibleBorder: {{ .Values.branding.light.focusSecondary | default .Values.branding.light.secondaryColor | quote }}
                cards:
                  headerTextColor: {{ .Values.branding.light.textPrimary | quote }}
                  headerBackgroundColor: {{ .Values.branding.light.cardHeaderColor | quote }}
                  headerBackgroundImage: none
          dark:
            defaultPageTheme: default
            options:
              tabs: mui
            pageTheme:
              default:
                backgroundColor:
                  - {{ .Values.branding.dark.headerStart | quote }}
                  - {{ .Values.branding.dark.headerEnd | quote }}
                fontColor: {{ .Values.branding.dark.headerFontColor | quote }}
            palette:
              primary:
                main: {{ .Values.branding.dark.primaryColor | quote }}
              secondary:
                main: {{ .Values.branding.dark.secondaryColor | quote }}
              text:
                primary: {{ .Values.branding.dark.textPrimary | quote }}
                secondary: {{ .Values.branding.dark.textSecondary | quote }}
              textSubtle: {{ .Values.branding.dark.textSecondary | quote }}
              tabbar:
                indicator: {{ .Values.branding.dark.indicatorColor | quote }}
              background:
                default: {{ .Values.branding.dark.canvasColor | quote }}
                paper: {{ .Values.branding.dark.cardColor | quote }}
              navigation:
                background: {{ .Values.branding.dark.shellColor | quote }}
                indicator: {{ .Values.branding.dark.indicatorColor | quote }}
                color: "#CBD5E1"
                selectedColor: "#FFFFFF"
                navItem:
                  hoverBackground: {{ .Values.branding.dark.shellHoverColor | quote }}
                submenu:
                  background: {{ .Values.branding.dark.shellColor | quote }}
              rhdh:
                general:
                  pageInset: {{ .Values.branding.pageInset | default "1rem" | quote }}
                  pageInsetBackgroundColor: {{ .Values.branding.dark.shellColor | quote }}
                  mainSectionBackgroundColor: {{ .Values.branding.dark.canvasColor | quote }}
                  cardBackgroundColor: {{ .Values.branding.dark.cardColor | quote }}
                  cardBorderColor: {{ .Values.branding.dark.borderColor | quote }}
                  paperBorderColor: {{ .Values.branding.dark.borderColor | quote }}
                  formControlBackgroundColor: {{ .Values.branding.dark.shellBorderColor | default "#2A2648" | quote }}
                  sidebarBackgroundColor: {{ .Values.branding.dark.shellColor | quote }}
                  sidebarDividerColor: {{ .Values.branding.dark.shellBorderColor | quote }}
                  sidebarItemSelectedBackgroundColor: {{ .Values.branding.dark.shellHoverColor | quote }}
                  tableBackgroundColor: {{ .Values.branding.dark.cardColor | quote }}
                  tableBorderColor: {{ .Values.branding.dark.borderColor | quote }}
                  tableRowHover: {{ .Values.branding.dark.cardHeaderColor | default "#272347" | quote }}
                  tableTitleColor: {{ .Values.branding.dark.textPrimary | quote }}
                  tableSubtitleColor: {{ .Values.branding.dark.textSecondary | quote }}
                  tableColumnTitleColor: {{ .Values.branding.dark.textSecondary | quote }}
                  tabsLinkHoverBackgroundColor: {{ .Values.branding.dark.tabsHoverBg | default "rgba(255, 90, 82, 0.16)" | quote }}
                  appBarBackgroundScheme: dark
                  appBarBackgroundColor: {{ .Values.branding.dark.shellColor | quote }}
                  appBarForegroundColor: {{ .Values.branding.dark.textPrimary | quote }}
                primary:
                  main: {{ .Values.branding.dark.primaryColor | quote }}
                  focusVisibleBorder: {{ .Values.branding.dark.focusPrimary | default .Values.branding.dark.primaryColor | quote }}
                secondary:
                  main: {{ .Values.branding.dark.secondaryColor | quote }}
                  focusVisibleBorder: {{ .Values.branding.dark.focusSecondary | default .Values.branding.dark.secondaryColor | quote }}
                cards:
                  headerTextColor: {{ .Values.branding.dark.textPrimary | quote }}
                  headerBackgroundColor: {{ .Values.branding.dark.cardHeaderColor | quote }}
                  headerBackgroundImage: none
      {{- end }}
{{- end }}
