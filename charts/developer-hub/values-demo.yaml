# ROSA demo overlay — matches the live developer-hub instance (guest + Entra + LDAP).
# Secrets come from Vault via ExternalSecret (secrets.mode=eso).
# Operator already lives in namespace rhdh-operator (cluster-wide CSV 1.10.4).
operator:
  enabled: false

instance:
  replicas: 1
  database:
    enableLocalDb: false

database:
  cnpg:
    enabled: true
    instances: 1
    storage: 10Gi
  external:
    enabled: true

app:
  title: ROSA Golden Path Demo
  organization: Demo
  # Cluster URLs live in values-deploy.yaml. Do not add a third overlay.
  readingAllow:
    - host: github.com
    - host: raw.githubusercontent.com
    - host: api.github.com
    - host: login.microsoftonline.com
    - host: graph.microsoft.com
    - host: app.snyk.io
    - host: api.snyk.io
    - host: bitbucket.org
    - host: jenkins.jenkins.svc
    - host: sonarqube.sonarqube.svc
    - host: vault.vault.svc
    - host: saas-stubs.saas-stubs.svc
    - host: mallamrakeshkumar.atlassian.net
    - host: wkf10640.live.dynatrace.com
    - host: wkf10640.apps.dynatrace.com
    - host: sso.dynatrace.com
    - host: dev374459.service-now.com

auth:
  environment: development
  signInPage:
    - microsoft
    - guest
  guest:
    enabled: true
  microsoft:
    domainHint: mallamrakeshgmail.onmicrosoft.com

catalog:
  demoKitchenSink:
    enabled: true
  locations:
    - type: url
      target: https://github.com/rmallam-rhdh/rhdh-platform-gitops/blob/main/golden-path/templates/template-quarkus-golden-path.yaml
      allow: [Template]
    - type: url
      target: https://github.com/rmallam-rhdh/rhdh-platform-gitops/blob/main/golden-path/templates/template-nodejs-golden-path.yaml
      allow: [Template]
    - type: url
      target: https://github.com/rmallam-rhdh/rhdh-platform-gitops/blob/main/golden-path/templates/template-start-feature-devspaces.yaml
      allow: [Template]
    - type: url
      target: https://github.com/rmallam-rhdh/rhdh-platform-gitops/blob/main/golden-path/templates/template-promote-to-prod.yaml
      allow: [Template]
    - type: file
      target: /opt/app-root/src/catalog-demo/catalog-info.yaml
      allow: [Component, System, User]

permission:
  includeTransitiveGroupOwnership: true
  adminUsers:
    - name: user:default/guest
  superUsers:
    - name: user:default/guest
  adminGroups: []
  pluginsWithPermission:
    - catalog
    - scaffolder
    - permission
    - kubernetes
  # Add only synced LDAP group names here — base roles & conditional policies live in values.yaml!
  teamGroups:
    readOnly:
      - team-payments-ro
      - team-retail-ro
    readWrite:
      - team-payments-rw
      - team-retail-rw

integrations:
  bitbucketCloud:
    enabled: true

plugins:
  kubernetes:
    clusterName: demo
    url: https://kubernetes.default.svc
    skipTLSVerify: true
    serviceAccountToken: ""
    caData: ""
  jenkins:
    instances:
      - name: default
        baseUrl: http://jenkins.jenkins.svc
        username: "${JENKINS_USERNAME}"
        apiKey: "${JENKINS_API_TOKEN}"
    proxyTarget: http://jenkins.jenkins.svc
    proxyAuth: "Basic ${JENKINS_BASIC_AUTH_B64}"
  argocd:
    namespacedApps: true
    username: "admin"
    password: "${ARGOCD_ADMIN_PASSWORD}"
    instances:
      - name: nonprod-argo
        url: https://openshift-gitops-server-openshift-gitops.{{ .Values.app.clusterBaseDomain }}
        username: "admin"
        password: "${ARGOCD_ADMIN_PASSWORD}"
      - name: prod-argo
        # Swap URL & credentials when pointing at a separate prod-argo OpenShift GitOps cluster
        url: https://openshift-gitops-server-openshift-gitops.{{ .Values.app.clusterBaseDomain }}
        username: "admin"
        password: "${ARGOCD_ADMIN_PASSWORD}"
  bitbucket:
    enabled: true
  apiDocs:
    enabled: false
  sonarqube:
    baseUrl: http://sonarqube.sonarqube.svc:9000
    apiKey: "${SONARQUBE_API_KEY}"
  snyk:
    mocked: true
  jira:
    baseUrl: https://mallamrakeshkumar.atlassian.net
    token: "${JIRA_TOKEN}"
    authorization: "${JIRA_TOKEN}"
    product: cloud
  artifactory:
    baseUrl: http://saas-stubs.saas-stubs.svc:8080
    token: "${ARTIFACTORY_TOKEN}"
  vault:
    enabled: true
    frontendPackage: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault:pr_1225__0.19.0
    backendPackage: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault-backend:pr_1225__0.21.0
    baseUrl: http://vault.vault.svc:8200
    token: "${VAULT_TOKEN}"
  vaultNamespace:
    enabled: true
    baseUrl: http://vault-enterprise-gw.vault-namespace-lab.svc.cluster.local:8200
    publicUrl: https://vault-ui.corp.example.com
    defaultMount: kv
    kubernetesAuth:
      role: rhdh-metadata-lister
      authPath: kubernetes
  servicenow:
    # Host, user, and password are Vault keys servicenow-base-url,
    # servicenow-username, and servicenow-password. A reclaimed
    # developer instance gets a new host, so the URL stays out of git.
    baseUrl: "${SERVICENOW_BASE_URL}"
    username: "${SERVICENOW_USERNAME}"
    password: "${SERVICENOW_PASSWORD}"
  kiali:
    url: "${KIALI_URL}"
    skipTLSVerify: true
    serviceAccountToken: "${KUBE_SA_TOKEN}"
  dynatrace:
    url: https://wkf10640.apps.dynatrace.com
    tokenUrl: https://sso.dynatrace.com/sso/oauth2/token
    clientId: "${DYNATRACE_CLIENT_ID}"
    clientSecret: "${DYNATRACE_CLIENT_SECRET}"
    accountUrn: "${DYNATRACE_ACCOUNT_URN}"
    accessToken: "${DYNATRACE_ACCESS_TOKEN}"
    apiTarget: https://wkf10640.live.dynatrace.com/api/v2
  apic:
    url: http://saas-stubs.saas-stubs.svc:8080
    clientId: "${APIC_CLIENT_ID}"
    clientSecret: "${APIC_SECRET}"
    apiKey: "${APIC_API_KEY}"
    baseUrl: http://saas-stubs.saas-stubs.svc:8080

secrets:
  mode: eso
