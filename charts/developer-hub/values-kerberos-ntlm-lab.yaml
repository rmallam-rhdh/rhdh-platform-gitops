# Pair with values-kerberos-lab.yaml for NTLM parent testing.
# Requires kerberos-lab deployed with values-ntlm-lab.yaml (corporateProxy.authMode=ntlm).
# Uses bridge-ubi (rhel9/squid + EPEL cntlm). Rebuild: TAG=0.3.0 ./charts/kerberos-lab/scripts/build-images.sh

kerberosBridgeSidecar:
  enabled: true
  proxyAuthMode: ntlm
  ntlmSecret: kerberos-bridge-ntlm
  # Dual-mode UBI bridge. Override to your cluster/GHCR tag after build.
  image: image-registry.openshift-image-registry.svc:5000/rhdh-kerberos/kerberos-lab-bridge-ubi:0.3.0
  imagePullPolicy: Always
  corporateProxyHostname: corporate-proxy.kerberos-lab.svc.cluster.local
  corporateProxyPort: "3128"
