# Core platform identity and system entities for RHDH.
# Application Components are registered via the Enterprise Golden Path templates.
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: guest
  description: Built-in lab guest identity so guest-owned entities resolve cleanly without orphan warnings
spec:
  profile:
    displayName: Platform Guest
    email: guest@corp.example.com
  memberOf:
    - developers
    - platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: plugin-kitchen-sink
  description: "Enterprise Golden Path Platform System [APPID: APP-1042]"
  tags:
    - golden-path
    - command-centre
  labels:
    platform.idp/app-id: "APP-1042"
spec:
  owner: group:default/developers
