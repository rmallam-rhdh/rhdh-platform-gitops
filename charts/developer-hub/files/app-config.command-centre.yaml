# ==============================================================================
# RHDH Dynamic Plugin "Command Centre" Entity Layout
# Managed via OpenShift GitOps (Argo CD Application: developer-hub)
#
# Architectural Principles:
#   1) Auto-Flowing Bento Grid on Overview (`gridColumnEnd: span X` ONLY):
#      RHDH's built-in CatalogEntityPage renders `Links + About` in a static left
#      rail (`gridColumn: "1 / span 4", gridRow: "span 2"`). Using `gridColumnEnd`
#      (never hardcoded start columns) lets dynamic KPI cards pack seamlessly into
#      Columns 5–12 of Rows 1–2 right beside `Links + About`, and automatically
#      reflow with zero empty holes when an entity omits optional annotations.
#   2) Compact KPI Cards Only on Overview:
#      Full-page multi-column data tables (Dynatrace Problems, ServiceNow Incidents,
#      Jira Backlogs, Kiali Mesh Graphs) live on full-width domain tabs so Overview
#      stays crisp, uniform (`maxHeight: 260px`), and 100% above-the-fold.
#   3) Deterministic Top Navigation Bar (`entityTabs` priority ordering):
#      Overview (100) -> CI/CD (90) -> Quality & Security (80) -> Runtime (70)
#      -> Operations (60) -> Docs (50) -> Dependencies (40).
#      Individual plugin tabs (/kiali, /jira, /servicenow, /dynatrace, /topology,
#      /kubernetes, /ci, /cd, /monitoring, /image-registry, /api) use `priority: -1`
#      so RHDH suppresses tab clutter cleanly.
# ==============================================================================
dynamicPlugins:
  frontend:

    # ── 1. Multi-Cluster Argo CD (Overview Top-Right Bento + CI/CD Tab) ──────
    backstage-community.plugin-argocd:
      entityTabs:
        # Anchor Overview at priority 100 so custom tabs never sort ahead of `/`
        - path: /
          title: Overview
          mountPoint: entity.page.overview
          priority: 100
        - path: /cd
          title: CD
          mountPoint: entity.page.cd
          priority: -1
      mountPoints:
        # Sits in Row 1, Cols 5–12 (`4 + 8 = 12`) right beside Links + About
        - mountPoint: entity.page.overview/cards
          importName: ArgocdDeploymentSummary
          config:
            priority: 100
            layout:
              gridColumnEnd:
                lg: "span 8"
                md: "span 6"
                xs: "span 12"
              "& > .MuiPaper-root, & > div > .MuiPaper-root":
                height: "100%"
                maxHeight: "260px"
                overflowY: "auto"
                borderRadius: "10px"
              "& .MuiCardHeader-root":
                padding: "10px 16px"
              "& .MuiCardHeader-title":
                fontSize: "0.95rem"
                fontWeight: "600"
            if:
              allOf:
                - isArgocdConfigured
        # Full-width Non-Prod & Prod Lifecycle Cards on CI/CD tab
        - mountPoint: entity.page.cicd/cards
          importName: ArgocdDeploymentLifecycle
          config:
            priority: 100
            layout:
              gridColumn: "1 / -1"
            if:
              allOf:
                - isArgocdConfigured

    # ── 2. Jenkins + Tekton (Overview Compact Card + Consolidated CI/CD Tab) ─
    backstage-community.plugin-jenkins:
      entityTabs:
        - path: /ci-cd
          title: CI/CD
          mountPoint: entity.page.cicd
          priority: 90
        - path: /ci
          title: CI
          mountPoint: entity.page.ci
          priority: -1
      mountPoints:
        # Sits in Cols 5–8 (`span 4`) right beside About (slides up to Row 1 if no Argo)
        - mountPoint: entity.page.overview/cards
          importName: EntityLatestJenkinsRunCard
          config:
            priority: 90
            layout:
              gridColumnEnd:
                lg: "span 4"
                md: "span 6"
                xs: "span 12"
              "& > .MuiPaper-root, & > div > .MuiPaper-root":
                height: "100%"
                maxHeight: "250px"
                display: "flex"
                flexDirection: "column"
                borderRadius: "10px"
              "& .MuiCardHeader-root":
                padding: "10px 16px"
              "& .MuiCardHeader-title":
                fontSize: "0.95rem"
                fontWeight: "600"
              "& .MuiCardContent-root":
                padding: "12px 16px"
                overflowY: "auto"
                flexGrow: "1"
            if:
              allOf:
                - isJenkinsAvailable
        - mountPoint: entity.page.cicd/cards
          importName: EntityJenkinsContent
          config:
            priority: 90
            layout:
              gridColumn: "1 / -1"
            if:
              allOf:
                - isJenkinsAvailable

    backstage-community.plugin-tekton:
      mountPoints:
        - mountPoint: entity.page.cicd/cards
          importName: TektonCI
          config:
            priority: 80
            layout:
              gridColumn: "1 / -1"
            if:
              allOf:
                - isTektonCIAvailable

    # ── 3. SonarQube + Snyk + Artifactory ("Quality & Security" Tab) ─────────
    backstage-community.plugin-sonarqube:
      entityTabs:
        - path: /quality-security
          title: Quality & Security
          mountPoint: entity.page.quality-security
          priority: 80
      mountPoints:
        # Sits in Cols 9–12 (`span 4`) completing the 12-column top bento rectangle
        - mountPoint: entity.page.overview/cards
          importName: EntitySonarQubeCard
          config:
            priority: 85
            layout:
              gridColumnEnd:
                lg: "span 4"
                md: "span 6"
                xs: "span 12"
              "& > .MuiPaper-root, & > div > .MuiPaper-root":
                height: "100%"
                maxHeight: "250px"
                display: "flex"
                flexDirection: "column"
                borderRadius: "10px"
              "& .MuiCardHeader-root":
                padding: "10px 16px"
              "& .MuiCardHeader-title":
                fontSize: "0.95rem"
                fontWeight: "600"
              "& .MuiCardContent-root":
                padding: "12px 16px"
                overflowY: "auto"
                flexGrow: "1"
            if:
              allOf:
                - isSonarQubeAvailable
        - mountPoint: entity.page.quality-security/cards
          importName: EntitySonarQubeContentPage
          config:
            priority: 100
            layout:
              gridColumn: "1 / -1"
            if:
              allOf:
                - isSonarQubeAvailable

    backstage-plugin-snyk:
      mountPoints:
        - mountPoint: entity.page.overview/cards
          importName: SnykOverview
          config:
            priority: 75
            layout:
              gridColumnEnd:
                lg: "span 4"
                md: "span 6"
                xs: "span 12"
              "& > .MuiPaper-root, & > div > .MuiPaper-root":
                height: "100%"
                maxHeight: "250px"
                display: "flex"
                flexDirection: "column"
                borderRadius: "10px"
              "& .MuiCardHeader-root":
                padding: "10px 16px"
              "& .MuiCardHeader-title":
                fontSize: "0.95rem"
                fontWeight: "600"
              "& .MuiCardContent-root":
                padding: "12px 16px"
                overflowY: "auto"
                flexGrow: "1"
            if:
              allOf:
                - isSnykAvailable
        - mountPoint: entity.page.quality-security/cards
          importName: EntitySnykContent
          config:
            priority: 90
            layout:
              gridColumn: "1 / -1"
            if:
              allOf:
                - isSnykAvailable

    backstage-community.plugin-jfrog-artifactory:
      entityTabs:
        - path: /image-registry
          title: Image Registry
          mountPoint: entity.page.image-registry
          priority: -1
      mountPoints:
        - mountPoint: entity.page.quality-security/cards
          importName: JfrogArtifactoryPage
          config:
            priority: 80
            layout:
              gridColumn: "1 / -1"
            if:
              anyOf:
                - isJfrogArtifactoryAvailable

    # ── 4. Topology + Kubernetes + Kiali ("Runtime" Tab — 3 Tabs -> 1) ───────
    backstage-community.plugin-topology:
      entityTabs:
        - path: /runtime
          title: Runtime
          mountPoint: entity.page.runtime
          priority: 70
        - path: /topology
          title: Topology
          mountPoint: entity.page.topology
          priority: -1
      mountPoints:
        - mountPoint: entity.page.runtime/cards
          importName: TopologyPage
          config:
            priority: 100
            layout:
              gridColumn: "1 / -1"
              height: "65vh"
            if:
              anyOf:
                - hasAnnotation: backstage.io/kubernetes-id
                - hasAnnotation: backstage.io/kubernetes-namespace

    backstage.plugin-kubernetes:
      entityTabs:
        - path: /kubernetes
          title: Kubernetes
          mountPoint: entity.page.kubernetes
          priority: -1
      mountPoints:
        - mountPoint: entity.page.runtime/cards
          importName: EntityKubernetesContent
          config:
            priority: 90
            layout:
              gridColumn: "1 / -1"
            if:
              anyOf:
                - hasAnnotation: backstage.io/kubernetes-id
                - hasAnnotation: backstage.io/kubernetes-namespace

    backstage-community.plugin-kiali:
      entityTabs:
        - path: /kiali
          title: Kiali
          mountPoint: entity.page.kiali
          priority: -1
      mountPoints:
        - mountPoint: entity.page.runtime/cards
          importName: EntityKialiContent
          config:
            priority: 80
            layout:
              gridColumn: "1 / -1"
            if:
              anyOf:
                - hasAnnotation: kiali.io/namespace
                - hasAnnotation: backstage.io/kubernetes-namespace

    # ── 5. Dynatrace + PagerDuty + Jira + ServiceNow ("Operations" Tab) ──────
    backstage-community.plugin-dynatrace:
      entityTabs:
        - path: /operations
          title: Operations
          mountPoint: entity.page.operations
          priority: 60
        - path: /dynatrace
          title: Dynatrace
          mountPoint: entity.page.dynatrace
          priority: -1
        - path: /monitoring
          title: Monitoring
          mountPoint: entity.page.monitoring
          priority: -1
      mountPoints:
        # Full 12-column width on Operations tab so all 7 Problems columns fit cleanly
        - mountPoint: entity.page.operations/cards
          importName: DynatraceTab
          config:
            priority: 100
            layout:
              gridColumn: "1 / -1"
            if:
              allOf:
                - isDynatraceAvailable

    dynatrace.backstage-plugin-dql:
      mountPoints: []

    pagerduty.backstage-plugin:
      mountPoints:
        # Ultra-compact KPI summary card on Overview (`EntityPagerDutySmallCard`)
        - mountPoint: entity.page.overview/cards
          importName: EntityPagerDutySmallCard
          config:
            priority: 80
            layout:
              gridColumnEnd:
                lg: "span 4"
                md: "span 6"
                xs: "span 12"
              "& > .MuiPaper-root, & > div > .MuiPaper-root":
                height: "100%"
                maxHeight: "250px"
                display: "flex"
                flexDirection: "column"
                borderRadius: "10px"
              "& .MuiCardHeader-root":
                padding: "10px 16px"
              "& .MuiCardHeader-title":
                fontSize: "0.95rem"
                fontWeight: "600"
              "& .MuiCardContent-root":
                padding: "12px 16px"
                overflowY: "auto"
                flexGrow: "1"
            if:
              allOf:
                - isPluginApplicableToEntity
        # Full PagerDuty incident & escalation console on Operations tab (span 6)
        - mountPoint: entity.page.operations/cards
          importName: EntityPagerDutyCard
          config:
            priority: 95
            layout:
              gridColumnEnd:
                lg: "span 6"
                md: "span 12"
                xs: "span 12"
            if:
              allOf:
                - isPluginApplicableToEntity

    roadiehq.backstage-plugin-jira:
      entityTabs:
        - path: /jira
          title: Jira
          mountPoint: entity.page.jira
          priority: -1
        - path: /issues
          title: Issues
          mountPoint: entity.page.issues
          priority: -1
      mountPoints:
        # Paired alongside PagerDuty (`6 + 6 = 12`) on Operations tab
        - mountPoint: entity.page.operations/cards
          importName: EntityJiraOverviewCard
          config:
            priority: 90
            layout:
              gridColumnEnd:
                lg: "span 6"
                md: "span 12"
                xs: "span 12"
            if:
              allOf:
                - isJiraAvailable

    backstage-community.plugin-servicenow:
      entityTabs:
        - path: /servicenow
          title: ServiceNow
          mountPoint: entity.page.servicenow
          priority: -1
      mountPoints:
        # Wrapped in an elevated bordered Paper surface on Operations tab
        - mountPoint: entity.page.operations/cards
          importName: ServicenowPage
          config:
            priority: 80
            layout:
              gridColumn: "1 / -1"
              backgroundColor: "background.paper"
              border: "1px solid"
              borderColor: "divider"
              borderRadius: "10px"
              padding: "16px"
            if:
              anyOf:
                - hasAnnotation: servicenow.com/entity-id

    # ── 6. Vault Compact Card + Built-In Tab Ordering (Docs & Dependencies) ──
    backstage-community.plugin-vault:
      mountPoints:
        - mountPoint: entity.page.overview/cards
          importName: EntityVaultCard
          config:
            priority: 70
            layout:
              gridColumnEnd:
                lg: "span 4"
                md: "span 6"
                xs: "span 12"
              "& > .MuiPaper-root, & > div > .MuiPaper-root":
                height: "100%"
                maxHeight: "250px"
                display: "flex"
                flexDirection: "column"
                borderRadius: "10px"
              "& .MuiCardHeader-root":
                padding: "10px 16px"
              "& .MuiCardHeader-title":
                fontSize: "0.95rem"
                fontWeight: "600"
              "& .MuiCardContent-root":
                padding: "12px 16px"
                overflowY: "auto"
                flexGrow: "1"
            if:
              anyOf:
                - hasAnnotation: vault.io/secrets-path

    backstage.plugin-techdocs:
      entityTabs:
        - path: /docs
          title: Docs
          mountPoint: entity.page.docs
          priority: 50
        - path: /dependencies
          title: Dependencies
          mountPoint: entity.page.dependencies
          priority: 40
        - path: /api
          title: API
          mountPoint: entity.page.api
          priority: -1
