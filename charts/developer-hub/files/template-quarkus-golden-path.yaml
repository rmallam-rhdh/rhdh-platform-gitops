apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: acme-quarkus-golden-path
  title: Quarkus backend (Jenkins + Helm + API)
  description: >
    Creates a Quarkus 3 / Java 21 service and registers System + Component
    (type: service) + API with providesApis. Use this first when you need a
    website + backend. Then run the Node.js website template and pick this
    System, Component, and API. Publishes to GitHub.
  tags:
    - quarkus
    - java
    - golden-path
    - jenkins
    - helm
    - sonarqube
    - demo
    - recommended
spec:
  owner: group:platform-team
  type: service
  parameters:
    - title: Backend service
      required: [appName, githubOwner, systemName]
      properties:
        appName:
          title: GitHub repository name
          description: Required. New public GitHub repo name (lowercase letters, numbers, hyphens).
          type: string
          pattern: '^[a-z][a-z0-9-]{2,28}[a-z0-9]$'
          ui:autofocus: true
        appDescription:
          title: Description
          type: string
          default: Quarkus golden-path backend with Jenkins, Helm, and OpenAPI
        githubOwner:
          title: GitHub owner (org or user)
          description: GitHub user or org that will own the new repository (default rmallam).
          type: string
          default: rmallam
          pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
        systemName:
          title: System name
          description: Catalog System this backend belongs to. The website template will pick this System.
          type: string
          default: acme-demo
          pattern: '^[a-z][a-z0-9-]{1,40}$'
        systemDescription:
          title: System description
          type: string
          default: Demo product (website + backend)
        port:
          title: Application port
          type: integer
          default: 8080
        targetNamespace:
          title: Deploy namespace
          type: string
          default: demo-dev
        clusterBaseDomain:
          title: OpenShift apps domain
          description: Host suffix for the mesh ingress Route (no scheme). Default is this ROSA cluster.
          type: string
          default: __CLUSTER_BASE_DOMAIN__
        sonarHostUrl:
          title: SonarQube URL (in-cluster)
          type: string
          default: http://sonarqube.sonarqube.svc:9000
        devSpacesBaseUrl:
          title: Dev Spaces URL
          type: string
          default: __DEVSPACES_BASE_URL__
  steps:
    - id: fetch-skeleton
      name: Fetch Quarkus golden-path skeleton
      action: fetch:template
      input:
        url: https://github.com/rmallam/RHDH-SM-DevSpaces/tree/demo/udi-devspaces/golden-path/demo/skeleton-quarkus-golden-path
        values:
          appName: ${{ parameters.appName }}
          appDescription: ${{ parameters.appDescription }}
          githubOwner: ${{ parameters.githubOwner }}
          systemName: ${{ parameters.systemName }}
          systemDescription: ${{ parameters.systemDescription }}
          port: ${{ parameters.port }}
          targetNamespace: ${{ parameters.targetNamespace }}
          clusterBaseDomain: ${{ parameters.clusterBaseDomain }}
          sonarHostUrl: ${{ parameters.sonarHostUrl }}
          sonarProjectKey: ${{ parameters.appName }}
          devSpacesBaseUrl: ${{ parameters.devSpacesBaseUrl }}
    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: github.com?owner=${{ parameters.githubOwner }}&repo=${{ parameters.appName }}
        description: ${{ parameters.appDescription }}
        defaultBranch: main
        repoVisibility: public
        gitCommitMessage: "Initial Quarkus golden path (Jenkins, Helm, API)"
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    text:
      - title: What was created
        content: |
          **GitHub repository:** ${{ steps['publish'].output.remoteUrl }}

          Catalog: System `${{ parameters.systemName }}` · Component `${{ parameters.appName }}` (service) · API `${{ parameters.appName }}-api` (providesApis).

          Next: run **Node.js website** and pick this System, Component, and API.

          | In Git | Path |
          |---|---|
          | catalog-info.yaml | `/catalog-info.yaml` |
          | OpenAPI | `/openapi.yaml` |
          | Helm chart | `/chart` (mesh: Route → Gateway → HTTPRoute, deny-all, STRICT mTLS) |
          | Jenkinsfile | `/Jenkinsfile` |

          **Not created automatically:** Jenkins job, Helm release, Argo CD Application,
          Sonar project, or OpenShift namespace (it must already exist).
    links:
      - title: GitHub repository
        url: ${{ steps['publish'].output.remoteUrl }}
        icon: github
      - title: catalog-info.yaml
        url: ${{ steps['publish'].output.repoContentsUrl }}/catalog-info.yaml
        icon: github
      - title: Helm chart
        url: ${{ steps['publish'].output.repoContentsUrl }}/chart
        icon: github
      - title: Jenkinsfile
        url: ${{ steps['publish'].output.repoContentsUrl }}/Jenkinsfile
        icon: github
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: Open in Dev Spaces
        url: ${{ parameters.devSpacesBaseUrl }}/dashboard/#/load-factory?url=${{ steps['publish'].output.remoteUrl }}&devfilePath=devfile.yaml
        icon: catalog
      - title: Dev Spaces dashboard
        url: ${{ parameters.devSpacesBaseUrl }}/dashboard/#/workspaces
        icon: catalog
      - title: OpenShift project
        url: https://console-openshift-console.${{ parameters.clusterBaseDomain }}/k8s/cluster/projects/demo-dev
        icon: catalog
