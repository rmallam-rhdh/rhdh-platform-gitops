# Optional namespace override (defaults automatically to `.Release.Namespace`).
# ClusterRoleBinding in manifests/devspaces-multicluster-redirector/rbac.yaml
# must reference the target namespace + ServiceAccount name (`<release>`).
namespace: ""

nameOverride: ""
fullnameOverride: ""

# Red Hat product image (requires pull secret for registry.redhat.io on the cluster).
image:
  repository: registry.redhat.io/devspaces/multicluster-redirector-rhel9
  tag: "3.31"
  digest: ""
  pullPolicy: IfNotPresent

# OpenShift OAuth Proxy sidecar. Listens HTTP on :8443; Route does edge TLS
# (matches upstream openshift/deployment.yaml — no in-pod TLS secret).
# OAuth cookie encryption secret (`<release>-session-secret`) is generated automatically
# with a random 32-character value via Helm `lookup` + `helm.sh/resource-policy: keep`
# (zero secret material or Vault/ESO configuration in Git).
oauthProxy:
  image: registry.redhat.io/openshift4/ose-oauth-proxy-rhel9@sha256:4da6381f4f79de6a6024554aa99129e9b79b7ad7fdde0b0bebbcb87421a97d7c
  pullPolicy: IfNotPresent

replicas: 2

# Quarkus GroupMappingService dynamically resolves the ConfigMap symlink on every
# request without needing a pod restart. Keep true if you also want rolling restarts.
rolloutOnConfigChange: true

pdb:
  enabled: true
  minAvailable: 1

resources:
  redirector:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  oauthProxy:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Fabric8 Kubernetes/OpenShift client timeouts (ms) + Netty 4.2 / Quarkus 3.39 CleanerJava9 workaround (quarkusio/quarkus#53309).
kubernetesClient:
  requestTimeoutMs: 60000
  connectionTimeoutMs: 30000
  javaToolOptions: "--add-opens=java.base/java.nio=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true -Dio.netty.noPreferDirect=true -Dio.netty.maxDirectMemory=268435456"

# Structured Datacenter / Cluster Routing (Recommended for IDP Teams):
# Define each Dev Spaces datacenter/cluster URL once (`url`), optional base
# entitlement AD group (`requiredGroup` for Pattern B `AND` logic), and a simple
# list of team/squad AD `groups` routed to that datacenter.
datacenters: {}

# Direct key -> URL overrides (merged with `datacenters` above; useful for one-off rules).
groupMapping: {}

# Deployment environment (`edev`, `nprd`, `prd`).
# When `venafi.enabled: true` and `environmentName != "edev"`, `venafi.gslbHostname`
# is automatically added as a second SAN in `spec.dnsNames` on `<release>-cert`.
environmentName: edev

route:
  # Empty host → OpenShift assigns <release>-<ns>.apps.<cluster> (or falls back to venafi.hostname when venafi.enabled=true).
  host: ""
  # Used for SA oauth-redirecturi when oauthRedirectReference is false.
  oauthCallbackUrl: ""
  # Prefer Route reference annotation (GitOps-friendly). Set false to use oauthCallbackUrl.
  oauthRedirectReference: true
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

# Venafi TPP Issuer + Certificate (`cert-manager.io/v1`).
# All resource & Secret names are generated automatically from `.Release.Name`:
#   - Issuer:                                    <release>-issuer (references `<release>-venafi-credentials`)
#   - Certificate:                               <release>-cert
#   - Certificate TLS Secret (mounted on Route): <release>-tls
#   - OpenShift Router TLS Role & RoleBinding:   <release>-router-tls
#   - Venafi Custom Field `Application Name`:    <release>
venafi:
  enabled: false
  hostname: ""
  gslbHostname: ""
  zone: ""
  tpp:
    url: ""
    # Defaults to `<release>-venafi-credentials` when empty.
    credentialsSecretName: ""
    caBundle: ""
    caBundleSecretRef:
      name: ""
      key: ca.crt
  issuer:
    create: true
    kind: Issuer
  duration: 17520h
  renewBefore: 17448h
  privateKeyRotationPolicy: Always
  attachToRoute: true
  annotations: {}
  customFields:
    technicalOwner: "Platform Engineering"
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: idp-platform
      app.kubernetes.io/component: multicluster-redirector
  subject:
    countries:
      - US
    localities:
      - San Francisco
    organizationalUnits:
      - Platform Engineering
    organizations:
      - Acme Corp
    provinces:
      - California

networkPolicy:
  enabled: true

routeLabels: {}
routeAnnotations: {}
