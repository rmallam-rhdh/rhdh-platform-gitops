{{- if eq (include "mcr.sessionSecretMode" .) "vaultStaticSecret" }}
{{- $vss := .Values.sessionSecret.vaultStaticSecret | default dict -}}
{{- $mount := $vss.mount | default "" | trim -}}
{{- $path := $vss.path | default "" | trim -}}
{{- $kvType := $vss.type | default "kv-v2" -}}
{{- $hmac := true -}}
{{- if hasKey $vss "hmacSecretData" -}}
{{- $hmac = $vss.hmacSecretData -}}
{{- end -}}
{{- $rollout := true -}}
{{- if hasKey $vss "rolloutRestart" -}}
{{- $rollout = $vss.rolloutRestart -}}
{{- end -}}
{{- $overwrite := true -}}
{{- if hasKey $vss "overwrite" -}}
{{- $overwrite = $vss.overwrite -}}
{{- end -}}
{{- if not $mount }}
{{- fail "sessionSecret.vaultStaticSecret.mount is required when sessionSecret.mode=vaultStaticSecret" }}
{{- end }}
{{- if not $path }}
{{- fail "sessionSecret.vaultStaticSecret.path is required when sessionSecret.mode=vaultStaticSecret" }}
{{- end }}
{{- if not (has $kvType (list "kv-v2" "kv-v1")) }}
{{- fail (printf "sessionSecret.vaultStaticSecret.type %q must be kv-v2 or kv-v1" $kvType) }}
{{- end }}
{{- if and $rollout (not $hmac) }}
{{- fail "sessionSecret.vaultStaticSecret.rolloutRestart=true requires hmacSecretData=true" }}
{{- end }}
{{- $destSecret := include "mcr.sessionSecretName" . -}}
{{- $vssName := $vss.name | default $destSecret -}}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $vssName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: {{ $kvType }}
  mount: {{ $mount | quote }}
  path: {{ $path | quote }}
  {{- if $vss.vaultNamespace }}
  namespace: {{ $vss.vaultNamespace | quote }}
  {{- end }}
  {{- if $vss.vaultAuthRef }}
  vaultAuthRef: {{ $vss.vaultAuthRef | quote }}
  {{- end }}
  {{- if $vss.version }}
  version: {{ int $vss.version }}
  {{- end }}
  refreshAfter: {{ $vss.refreshAfter | default "1h" | quote }}
  hmacSecretData: {{ $hmac }}
  {{- if $rollout }}
  rolloutRestartTargets:
    - kind: Deployment
      name: {{ include "mcr.fullname" . }}
  {{- end }}
  destination:
    name: {{ $destSecret }}
    create: true
    overwrite: {{ $overwrite }}
    type: Opaque
    labels:
      {{- include "mcr.labels" . | nindent 6 }}
    {{- with $vss.transformation }}
    transformation:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
