{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcr.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      {{- include "mcr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8443
  egress:
    # Allow all egress: oauth-proxy and the redirector need the OpenShift API,
    # cluster DNS, and the external OAuth authorize endpoint. Tighten later if
    # API/OAuth CIDRs are known for this cluster.
    - {}
{{- end }}
