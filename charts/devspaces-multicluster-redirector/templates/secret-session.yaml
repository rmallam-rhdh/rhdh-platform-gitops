{{- if .Values.sessionSecret.create }}
{{- $secretName := include "mcr.sessionSecretName" . -}}
{{- $ns := .Values.namespace -}}
{{- $existing := lookup "v1" "Secret" $ns $secretName -}}
{{- $session := "" -}}
{{- if and $existing $existing.data }}
{{- $session = index $existing.data "session_secret" | default "" -}}
{{- end -}}
{{- if not $session }}
{{- if .Values.sessionSecret.value }}
{{- if lt (len .Values.sessionSecret.value) 16 }}
{{- fail "sessionSecret.value must be at least 16 characters for oauth-proxy cookie encryption" -}}
{{- end }}
{{- $session = .Values.sessionSecret.value | b64enc -}}
{{- else }}
{{- $session = randAlphaNum 32 | b64enc -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    helm.sh/resource-policy: keep
type: Opaque
data:
  session_secret: {{ $session }}
{{- end }}
