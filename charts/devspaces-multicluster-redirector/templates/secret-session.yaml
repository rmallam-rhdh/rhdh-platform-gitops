{{- $secretName := include "mcr.sessionSecretName" . -}}
{{- $secretKey := include "mcr.sessionSecretKey" . -}}
{{- $ns := include "mcr.namespace" . -}}
{{- $existing := lookup "v1" "Secret" $ns $secretName -}}
{{- $session := "" -}}
{{- if and $existing $existing.data }}
{{- $session = index $existing.data $secretKey | default "" -}}
{{- end -}}
{{- if not $session }}
{{- $session = randAlphaNum 32 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $secretKey }}: {{ $session }}
