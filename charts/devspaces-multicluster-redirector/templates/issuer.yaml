{{- if eq (include "mcr.venafiCreateIssuer" .) "true" }}
{{- $ns := include "mcr.namespace" . -}}
{{- $credSecret := include "mcr.venafiCredentialsSecretName" . -}}
{{- $credMode := include "mcr.venafiCredentialsSecretMode" . -}}
{{- $credCfg := (.Values.venafi).credentialsSecret | default dict -}}
{{- if eq $credMode "vaultStaticSecret" }}
{{- $vss := $credCfg.vaultStaticSecret | default dict -}}
{{- $mount := ($vss.mount | default "secrets") | toString | trim -}}
{{- $path := ($vss.path | default "") | toString | trim -}}
{{- $kvType := ($vss.type | default "kv-v2") | toString | trim -}}
{{- $hmac := true -}}
{{- if hasKey $vss "hmacSecretData" -}}
{{- $hmac = $vss.hmacSecretData -}}
{{- end -}}
{{- $overwrite := true -}}
{{- if hasKey $vss "overwrite" -}}
{{- $overwrite = $vss.overwrite -}}
{{- end -}}
{{- if not $mount }}
{{- fail "venafi.credentialsSecret.vaultStaticSecret.mount is required when venafi.credentialsSecret.mode=vaultStaticSecret" }}
{{- end }}
{{- if not $path }}
{{- fail "venafi.credentialsSecret.vaultStaticSecret.path is required when venafi.credentialsSecret.mode=vaultStaticSecret" }}
{{- end }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ $credSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  type: {{ $kvType }}
  mount: {{ $mount | quote }}
  path: {{ $path | quote }}
  {{- if $vss.vaultNamespace }}
  namespace: {{ $vss.vaultNamespace | quote }}
  {{- end }}
  {{- if $vss.vaultAuthRef }}
  vaultAuthRef: {{ $vss.vaultAuthRef | quote }}
  {{- end }}
  refreshAfter: {{ $vss.refreshAfter | default "1h" | quote }}
  hmacSecretData: {{ $hmac }}
  destination:
    name: {{ $credSecret }}
    create: true
    overwrite: {{ $overwrite }}
    type: Opaque
    labels:
      {{- include "mcr.labels" . | nindent 6 }}
    {{- with $vss.transformation }}
    transformation:
      {{- toYaml . | nindent 6 }}
    {{- end }}
---
{{- else if eq $credMode "eso" }}
{{- $eso := $credCfg.eso | default dict -}}
{{- $storeName := ($eso.storeName | default "vault-secret-store") | toString | trim -}}
{{- $remoteKey := ($eso.remoteKey | default "") | toString | trim -}}
{{- if not $remoteKey }}
{{- fail "venafi.credentialsSecret.eso.remoteKey is required when venafi.credentialsSecret.mode=eso" }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $credSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $eso.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $eso.storeKind | default "ClusterSecretStore" }}
    name: {{ $storeName }}
  target:
    name: {{ $credSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ $eso.secretKey | default "access-token" }}
      remoteRef:
        key: {{ $remoteKey }}
        property: {{ $eso.remoteProperty | default "access-token" }}
---
{{- else if eq $credMode "secret" }}
{{- $token := ($credCfg.accessToken | default "") | toString | trim -}}
{{- $username := ($credCfg.username | default "") | toString | trim -}}
{{- $password := ($credCfg.password | default "") | toString -}}
{{- if and (not $token) (not (and $username $password)) }}
{{- fail "venafi.credentialsSecret.mode=secret requires either accessToken or both username and password" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credSecret }}
  namespace: {{ $ns }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
data:
  {{- if $token }}
  access-token: {{ $token | b64enc }}
  {{- else }}
  username: {{ $username | b64enc }}
  password: {{ $password | b64enc }}
  {{- end }}
---
{{- end }}
{{- $tpp := (.Values.venafi).tpp | default dict }}
{{- $caSecretRef := $tpp.caBundleSecretRef | default dict }}
apiVersion: cert-manager.io/v1
kind: {{ include "mcr.venafiIssuerKind" . }}
metadata:
  name: {{ include "mcr.venafiIssuerName" . }}
  {{- if ne (include "mcr.venafiIssuerKind" .) "ClusterIssuer" }}
  namespace: {{ $ns }}
  {{- end }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  venafi:
    zone: {{ include "mcr.venafiZone" . | quote }}
    tpp:
      url: {{ include "mcr.venafiTppUrl" . | quote }}
      credentialsRef:
        name: {{ $credSecret }}
      {{- if $tpp.caBundle }}
      caBundle: {{ $tpp.caBundle | quote }}
      {{- else if $caSecretRef.name }}
      caBundleSecretRef:
        name: {{ $caSecretRef.name }}
        key: {{ $caSecretRef.key | default "ca.crt" }}
      {{- end }}
{{- end }}
