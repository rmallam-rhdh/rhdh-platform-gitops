{{- if eq (include "mcr.venafiCreateIssuer" .) "true" }}
{{- $ns := include "mcr.namespace" . -}}
{{- $credSecret := include "mcr.venafiCredentialsSecretName" . -}}
{{- $tpp := (.Values.venafi).tpp | default dict -}}
{{- $caSecretRef := $tpp.caBundleSecretRef | default dict -}}
apiVersion: cert-manager.io/v1
kind: {{ include "mcr.venafiIssuerKind" . }}
metadata:
  name: {{ include "mcr.venafiIssuerName" . }}
  {{- if ne (include "mcr.venafiIssuerKind" .) "ClusterIssuer" }}
  namespace: {{ $ns }}
  {{- end }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  venafi:
    zone: {{ include "mcr.venafiZone" . | quote }}
    tpp:
      url: {{ include "mcr.venafiTppUrl" . | quote }}
      credentialsRef:
        name: {{ $credSecret }}
      {{- if $tpp.caBundle }}
      caBundle: {{ $tpp.caBundle | quote }}
      {{- else if $caSecretRef.name }}
      caBundleSecretRef:
        name: {{ $caSecretRef.name }}
        key: {{ $caSecretRef.key | default "ca.crt" }}
      {{- end }}
{{- end }}
