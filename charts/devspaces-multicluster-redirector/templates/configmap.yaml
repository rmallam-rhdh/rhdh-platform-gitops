apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcr.fullname" . }}-group-mapping
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  group-mapping.json: |
    {{- .Values.groupMapping | toJson | nindent 4 }}
