{{- range $groupKey, $targetUrl := .Values.groupMapping }}
{{- if not (trim $groupKey) }}
{{- fail "groupMapping keys must not be empty or whitespace-only" }}
{{- end }}
{{- if not (regexMatch "^https?://[^[:space:]]+$" (toString $targetUrl)) }}
{{- fail (printf "groupMapping[%q] value %q must be a valid http(s):// URL" $groupKey (toString $targetUrl)) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcr.fullname" . }}-group-mapping
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  group-mapping.json: |
    {{- .Values.groupMapping | toJson | nindent 4 }}
