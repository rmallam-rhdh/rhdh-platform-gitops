{{- $finalMap := dict -}}
{{- range $dcName, $dc := (.Values.datacenters | default dict) }}
{{- if and $dc (kindIs "map" $dc) }}
{{- $url := ($dc.url | default "" | toString | trim) -}}
{{- if $url }}
{{- if not (regexMatch "^https?://[^[:space:]]+$" $url) }}
{{- fail (printf "datacenters.%s.url %q must be a valid http(s):// URL" $dcName $url) }}
{{- end }}
{{- $reqGroup := ($dc.requiredGroup | default "" | toString | trim) -}}
{{- $groupList := list -}}
{{- if kindIs "slice" $dc.groups }}
{{- $groupList = $dc.groups -}}
{{- else if and $dc.groups (kindIs "string" $dc.groups) }}
{{- $groupList = splitList "," $dc.groups -}}
{{- end }}
{{- range $g := $groupList }}
{{- if ne ($g | toString) "<nil>" }}
{{- $groupName := ($g | default "" | toString | trim) -}}
{{- if not $groupName }}
{{- fail (printf "datacenters.%s.groups entries must not be empty" $dcName) }}
{{- end }}
{{- $key := $groupName -}}
{{- if and $reqGroup (ne $groupName $reqGroup) (not (contains "," $groupName)) }}
{{- $key = printf "%s,%s" $reqGroup $groupName -}}
{{- end }}
{{- $_ := set $finalMap $key $url -}}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $groupKey, $targetVal := (.Values.groupMapping | default dict) }}
{{- $cleanKey := ($groupKey | toString | trim) -}}
{{- if not $cleanKey }}
{{- fail "groupMapping keys must not be empty or whitespace-only" }}
{{- end }}
{{- if and $targetVal (kindIs "map" $targetVal) }}
{{- /* Also support nested { url, requiredGroup, groups } if placed under groupMapping by mistake */ -}}
{{- $url := ($targetVal.url | default "" | toString | trim) -}}
{{- if not (regexMatch "^https?://[^[:space:]]+$" $url) }}
{{- fail (printf "groupMapping.%s.url %q must be a valid http(s):// URL" $cleanKey $url) }}
{{- end }}
{{- $reqGroup := ($targetVal.requiredGroup | default "" | toString | trim) -}}
{{- range $g := ($targetVal.groups | default list) }}
{{- $groupName := ($g | default "" | toString | trim) -}}
{{- if $groupName }}
{{- $key := $groupName -}}
{{- if and $reqGroup (ne $groupName $reqGroup) (not (contains "," $groupName)) }}
{{- $key = printf "%s,%s" $reqGroup $groupName -}}
{{- end }}
{{- $_ := set $finalMap $key $url -}}
{{- end }}
{{- end }}
{{- else if ne ($targetVal | toString) "<nil>" }}
{{- $cleanUrl := ($targetVal | default "" | toString | trim) -}}
{{- if not (regexMatch "^https?://[^[:space:]]+$" $cleanUrl) }}
{{- fail (printf "groupMapping[%q] value %q must be a valid http(s):// URL" $cleanKey $cleanUrl) }}
{{- end }}
{{- $_ := set $finalMap $cleanKey $cleanUrl -}}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcr.fullname" . }}-group-mapping
  namespace: {{ include "mcr.namespace" . }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  group-mapping.json: |
    {{- $finalMap | toPrettyJson | nindent 4 }}
