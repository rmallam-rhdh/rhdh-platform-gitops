{{- $finalMap := dict -}}
{{- range $dcName, $dc := (.Values.datacenters | default dict) }}
{{- if $dc }}
{{- $url := ($dc.url | default "" | toString | trim) -}}
{{- if $url }}
{{- if not (regexMatch "^https?://[^[:space:]]+$" $url) }}
{{- fail (printf "datacenters.%s.url %q must be a valid http(s):// URL" $dcName $url) }}
{{- end }}
{{- $reqGroup := ($dc.requiredGroup | default "" | toString | trim) -}}
{{- range $g := ($dc.groups | default list) }}
{{- $groupName := ($g | toString | trim) -}}
{{- if not $groupName }}
{{- fail (printf "datacenters.%s.groups entries must not be empty" $dcName) }}
{{- end }}
{{- $key := $groupName -}}
{{- if and $reqGroup (ne $groupName $reqGroup) (not (contains "," $groupName)) }}
{{- $key = printf "%s,%s" $reqGroup $groupName -}}
{{- end }}
{{- $_ := set $finalMap $key $url -}}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range $groupKey, $targetUrl := (.Values.groupMapping | default dict) }}
{{- if not (trim $groupKey) }}
{{- fail "groupMapping keys must not be empty or whitespace-only" }}
{{- end }}
{{- if not (regexMatch "^https?://[^[:space:]]+$" (toString $targetUrl)) }}
{{- fail (printf "groupMapping[%q] value %q must be a valid http(s):// URL" $groupKey (toString $targetUrl)) }}
{{- end }}
{{- $_ := set $finalMap (trim $groupKey) (toString $targetUrl) -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcr.fullname" . }}-group-mapping
  namespace: {{ include "mcr.namespace" . }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  group-mapping.json: |
    {{- $finalMap | toJson | nindent 4 }}
