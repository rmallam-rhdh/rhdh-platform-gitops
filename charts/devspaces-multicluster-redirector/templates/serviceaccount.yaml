apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mcr.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    {{- if .Values.route.oauthRedirectReference }}
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ include "mcr.fullname" . }}"}}
    {{- else }}
    {{- $cb := include "mcr.oauthCallbackUrl" . -}}
    {{- if $cb }}
    serviceaccounts.openshift.io/oauth-redirecturi.primary: {{ $cb | quote }}
    {{- end }}
    {{- end }}
