apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mcr.fullname" . }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - ""
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - ""
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
      - selfsubjectrulesreviews
    verbs:
      - create
  - apiGroups:
      - user.openshift.io
    resources:
      - users
      - groups
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcr.fullname" . }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mcr.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mcr.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
