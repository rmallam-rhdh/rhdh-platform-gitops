apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "mcr.fullname" . }}
  namespace: {{ include "mcr.namespace" . }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
    {{- with .Values.routeLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    {{- with .Values.routeAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if (.Values.route).host }}
  host: {{ (.Values.route).host | quote }}
  {{- else if and (.Values.venafi).enabled (.Values.venafi).hostname }}
  host: {{ (.Values.venafi).hostname | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "mcr.fullname" . }}
    weight: 100
  port:
    targetPort: https
  tls:
    termination: {{ ((.Values.route).tls).termination | default "edge" }}
    insecureEdgeTerminationPolicy: {{ ((.Values.route).tls).insecureEdgeTerminationPolicy | default "Redirect" }}
    {{- if eq (include "mcr.venafiAttachToRoute" .) "true" }}
    externalCertificate:
      name: {{ include "mcr.tlsCertificateSecretName" . }}
    {{- else if ((.Values.route).tls).externalCertificateSecretName }}
    externalCertificate:
      name: {{ ((.Values.route).tls).externalCertificateSecretName }}
    {{- end }}
  wildcardPolicy: None
