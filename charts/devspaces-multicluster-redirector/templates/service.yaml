apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcr.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    {{- include "mcr.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: 8443
      protocol: TCP
