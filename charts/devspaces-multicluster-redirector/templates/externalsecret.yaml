{{- if eq (include "mcr.sessionSecretMode" .) "eso" }}
{{- $eso := .Values.sessionSecret.eso | default dict -}}
{{- $storeName := $eso.storeName | default "" | trim -}}
{{- $remoteKey := $eso.remoteKey | default "" | trim -}}
{{- if not $storeName }}
{{- fail "sessionSecret.eso.storeName is required when sessionSecret.mode=eso" }}
{{- end }}
{{- if not $remoteKey }}
{{- fail "sessionSecret.eso.remoteKey is required when sessionSecret.mode=eso" }}
{{- end }}
{{- $targetSecret := include "mcr.sessionSecretName" . -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $targetSecret }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "mcr.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: {{ $eso.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $eso.storeKind | default "ClusterSecretStore" }}
    name: {{ $storeName }}
  target:
    name: {{ $targetSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ include "mcr.sessionSecretKey" . }}
      remoteRef:
        key: {{ $remoteKey }}
        property: {{ $eso.remoteProperty | default "session_secret" }}
{{- end }}
