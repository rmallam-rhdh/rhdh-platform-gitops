# Per-cluster overrides. Edit in place — do not add values-<cluster>.yaml.
# All resource, Issuer, Certificate, and Secret names are automatically derived from `.Release.Name`.

# Environment (`edev` omits GSLB SAN; `nprd` / `prd` includes both cluster hostname + gslbHostname SANs).
environmentName: nprd

route:
  host: ""
  oauthCallbackUrl: ""

# Venafi TPP Issuer (`<release>-issuer`), Credentials (`<release>-venafi-credentials`),
# Certificate (`<release>-cert`), and Route TLS Secret (`<release>-tls`).
venafi:
  enabled: true
  hostname: devspaces-redirector.apps.dc1.example.com
  gslbHostname: devspaces-redirector.example.com
  zone: "VED\\Policy\\Certificates\\DevSpaces"
  tpp:
    url: https://tpp.example.com/vedsdk
    # Optional custom CA trust if TPP uses an internal enterprise CA:
    # caBundleSecretRef:
    #   name: enterprise-ca-bundle
    #   key: ca.crt
  credentialsSecret:
    mode: vaultStaticSecret
    vaultStaticSecret:
      type: kv-v2
      mount: secrets
      path: venafi/tpp
      vaultAuthRef: default
  customFields:
    technicalOwner: "Platform Engineering"
  subject:
    countries:
      - US
    localities:
      - San Francisco
    organizationalUnits:
      - Platform Engineering
    organizations:
      - Acme Corp
    provinces:
      - California

# Pull oauth-proxy session cookie secret (`<release>-session-secret`) from HashiCorp Vault via VaultStaticSecret.
# Seed in Vault once (use the SAME secret across Primary and DR clusters):
#   vault kv put secrets/devspaces-redirector/session session_secret="$(openssl rand -hex 16)"
sessionSecret:
  mode: vaultStaticSecret
  vaultStaticSecret:
    type: kv-v2
    mount: secrets
    path: devspaces-redirector/session
    vaultAuthRef: default

# Structured Datacenter / Cluster Routing:
datacenters:
  dc1:
    url: https://devspaces.apps.dc1.example.com
    requiredGroup: ""
    groups:
      - developers
      - corp_nprd_devspaces_admin
      - corp_nprd_payments_devs
      - corp_nprd_channels_devs
  dc2:
    url: https://devspaces.apps.dc2.example.com
    requiredGroup: ""
    groups:
      - dr-developers
      - corp_nprd_lending_devs
      - corp_nprd_wealth_devs

groupMapping: {}
