# Per-cluster overrides. Edit in place — do not add values-<cluster>.yaml.
#
# After first sync, set route.host (or oauthCallbackUrl) to the Route URL so
# OAuth works if oauthRedirectReference is disabled.
route:
  host: ""
  oauthCallbackUrl: ""

# Pull oauth-proxy session cookie secret from HashiCorp Vault via VaultStaticSecret.
# Seed in Vault once (use the SAME secret across Primary and DR clusters):
#   vault kv put secrets/devspaces-redirector/session session_secret="$(openssl rand -hex 16)"
#
# Other supported modes: `eso` (ExternalSecret), `external` (existing Secret), `secret` (lab only).
sessionSecret:
  mode: vaultStaticSecret
  vaultStaticSecret:
    type: kv-v2
    mount: secrets
    path: devspaces-redirector/session
    vaultAuthRef: default
    # vaultNamespace: ""   # Set if using HashiCorp Vault Enterprise namespaces

# Structured Datacenter / Cluster Routing (IDP Team just adds AD group names under `groups:` for each DC):
#   - url: Target Dev Spaces (CheCluster) dashboard URL for this DC/cluster.
#   - requiredGroup: (Optional) Base AD group for Pattern B `AND` logic.
#       * Leave "" to map each group in `groups:` directly ("<group>": "<url>").
#       * Set e.g. "corp_nprd_devspaces_users" to require BOTH the base group AND
#         the squad group ("corp_nprd_devspaces_users,<group>": "<url>").
#   - groups: List of AD / OpenShift groups routed to this DC's Dev Spaces URL.
datacenters:
  dc1:
    url: https://devspaces.apps.dc1.example.com
    requiredGroup: ""
    groups:
      - developers
      - corp_nprd_devspaces_admin
      - corp_nprd_payments_devs
      - corp_nprd_channels_devs
  dc2:
    url: https://devspaces.apps.dc2.example.com
    requiredGroup: ""
    groups:
      - dr-developers
      - corp_nprd_lending_devs
      - corp_nprd_wealth_devs

# Optional direct key -> URL overrides (merged with `datacenters` above):
groupMapping: {}
