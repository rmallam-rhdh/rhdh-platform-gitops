# Sail + Kiali operators are assumed installed in openshift-operators.

createNamespaces: true

istio:
  name: default
  namespace: istio-system
  # Label the istio namespace istio-discovery: enabled (matches the discoverySelectors below).
  namespaceDiscoveryLabel: true
  profile: ambient
  # Empty = operator default (lab). Pin e.g. v1.30.5 for a freeze.
  version: ""
  updateStrategy: InPlace
  trustedZtunnelNamespace: istio-system
  discoverySelectors:
    - matchLabels:
        istio.io/dataplane-mode: ambient
    - matchLabels:
        istio-discovery: enabled
  pilot:
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

istioCni:
  name: default
  namespace: istio-cni
  profile: ambient
  version: ""

ztunnel:
  name: default
  # Run ztunnel in istio-system (matching istio.trustedZtunnelNamespace).
  namespace: istio-system

kiali:
  name: kiali
  namespace: istio-system
  authStrategy: anonymous
  prometheusUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
  # Second Kiali instance with auth.strategy=token and full Thanos TLS verification for RHDH plugin
  tokenInstance:
    enabled: true
    name: kiali-token
    viewOnlyMode: true

telemetry:
  enabled: true

# Mesh-wide inbound mTLS policy (selector-less PeerAuthentication in istio.namespace).
# Set enabled: true to enforce mesh-level mTLS across all mesh-enrolled namespaces;
# individual namespaces or workloads can still override with their own PeerAuthentication.
mtls:
  enabled: true
  # STRICT | PERMISSIVE | DISABLE
  mode: STRICT
  name: default
