{{- if .Values.createNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.istio.namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
    {{- if .Values.istio.namespaceDiscoveryLabel }}
    istio-discovery: enabled
    {{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.istioCni.namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
{{- if ne .Values.ztunnel.namespace .Values.istio.namespace }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.ztunnel.namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
    istio.io/dataplane-mode: ambient
{{- end }}
{{- end }}
