{{- if .Values.createNamespaces }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.istio.namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
    istio-discovery: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.istioCni.namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.ztunnel.namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
    istio.io/dataplane-mode: ambient
{{- end }}
