apiVersion: kiali.io/v1alpha1
kind: Kiali
metadata:
  name: {{ .Values.kiali.name }}
  namespace: {{ .Values.kiali.namespace }}
  labels:
    {{- include "mesh.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  auth:
    strategy: {{ .Values.kiali.authStrategy }}
  deployment:
    accessible_namespaces:
      - "**"
    image_pull_policy: Always
    ingress:
      enabled: true
    probes:
      startup:
        initial_delay_seconds: 15
        period_seconds: 10
        failure_threshold: 18
      readiness:
        initial_delay_seconds: 5
        period_seconds: 10
      liveness:
        initial_delay_seconds: 30
        period_seconds: 30
  external_services:
    istio:
      root_namespace: {{ .Values.istio.namespace }}
    prometheus:
      url: {{ .Values.kiali.prometheusUrl | quote }}
      auth:
        type: bearer
        use_kiali_token: true
        insecure_skip_verify: true
      thanos_proxy:
        enabled: true
    grafana:
      enabled: false
  istio_namespace: {{ .Values.istio.namespace }}
