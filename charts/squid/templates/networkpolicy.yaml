apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: squid
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "squid.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: squid
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rhdh
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
