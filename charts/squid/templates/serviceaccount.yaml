apiVersion: v1
kind: ServiceAccount
metadata:
  name: squid
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "squid.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: squid-anyuid
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "squid.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: squid
    namespace: {{ .Values.namespace }}
